# Session 17 homework - Kushal Talati (24BCS10123)
# DevSecOps pipeline for session-17-devsecops/kushal-24bcs10123/secure-converter
#
#  code -> build -> unit-test -> sast -> sca -> secret-scan -> docker-build -> image-scan
#       -> security-gate -> push-image -> deploy-kubernetes
name: 24bcs10123 session17 devsecops

on:
  push:
    branches: ["ci-kushal-*", "sessions-13-21-kushal"]
    paths:
      - "session-17-devsecops/kushal-24bcs10123/**"
      - ".github/workflows/24bcs10123-session17-devsecops.yml"
  workflow_dispatch:

env:
  APP_DIR: session-17-devsecops/kushal-24bcs10123/secure-converter
  IMAGE: ghcr.io/${{ github.repository_owner }}/secure-converter
  TRIVY_VERSION: v0.75.0
  GITLEAKS_VERSION: 8.30.1

defaults:
  run:
    working-directory: session-17-devsecops/kushal-24bcs10123/secure-converter

jobs:
  # 1 ------------------------------------------------------------------ build
  build:
    name: 1. build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "**/requirements*.txt" }
      - name: install runtime dependencies and byte-compile
        run: |
          pip install -r requirements.txt
          python -m compileall -q app && echo "compiled OK"
          pip freeze > frozen-requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-requirements
          path: ${{ env.APP_DIR }}/frozen-requirements.txt

  # 2 -------------------------------------------------------------- unit test
  unit-test:
    name: 2. unit test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "**/requirements*.txt" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -v --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-report
          path: ${{ env.APP_DIR }}/junit.xml

  # 3 ------------------------------------------------------------------- SAST
  sast:
    name: 3. sast (bandit + semgrep)
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install bandit semgrep
      - name: bandit
        run: bandit -c security/bandit.yaml -r app -ll -ii -f txt
      - name: semgrep (registry packs + my rules)
        run: semgrep scan --config p/python --config p/owasp-top-ten --config security/semgrep.yaml --error --metrics=off app
        env:
          SEMGREP_SEND_METRICS: "off"

  # 4 -------------------------------------------------------------------- SCA
  sca:
    name: 4. sca (pip-audit + trivy fs)
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      - name: pip-audit against the pinned requirements
        run: pip-audit -r requirements.txt --strict --desc
      - name: install trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin "$TRIVY_VERSION"
      - name: trivy fs (dependency vulnerabilities in the source tree)
        run: trivy fs --config security/trivy.yaml --scanners vuln .

  # 5 ------------------------------------------------------------ secret scan
  secret-scan:
    name: 5. secret scan (gitleaks)
    needs: sca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: gitleaks over the application directory
        run: gitleaks dir . --config security/gitleaks.toml --exit-code 1 --redact --no-banner --verbose

  # 6 ------------------------------------------------------------ docker build
  docker-build:
    name: 6. docker build
    needs: secret-scan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: build image (not pushed yet - it has to pass the scan and the gate first)
        run: |
          docker build --build-arg GIT_SHA="$GITHUB_SHA" --build-arg BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            -t "$IMAGE:${{ steps.meta.outputs.tag }}" .
          docker save "$IMAGE:${{ steps.meta.outputs.tag }}" -o /tmp/image.tar
          docker image inspect "$IMAGE:${{ steps.meta.outputs.tag }}" --format 'size={{.Size}} user={{.Config.User}}'
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ github.run_number }}
          path: /tmp/image.tar
          retention-days: 1

  # 7 -------------------------------------------------------------- image scan
  image-scan:
    name: 7. container image scan (trivy)
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ github.run_number }}
          path: /tmp
      - run: docker load -i /tmp/image.tar
      - name: install trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin "$TRIVY_VERSION"
      - name: trivy config (Dockerfile + kubernetes manifests misconfiguration)
        run: trivy config --config security/trivy.yaml --ignorefile security/.trivyignore .
      - name: trivy image (OS packages + python packages inside the image)
        run: trivy image --config security/trivy.yaml --ignorefile security/.trivyignore "$IMAGE:${{ needs.docker-build.outputs.tag }}"

  # 8 ------------------------------------------------------------ security gate
  security-gate:
    name: 8. security gate
    needs: [unit-test, sast, sca, secret-scan, image-scan]
    if: always()                     # the gate itself always runs, so the verdict is visible
    runs-on: ubuntu-latest
    steps:
      - name: every quality and security stage must have passed
        working-directory: /
        run: |
          echo "unit-test   : ${{ needs.unit-test.result }}"
          echo "sast        : ${{ needs.sast.result }}"
          echo "sca         : ${{ needs.sca.result }}"
          echo "secret-scan : ${{ needs.secret-scan.result }}"
          echo "image-scan  : ${{ needs.image-scan.result }}"
          for r in "${{ needs.unit-test.result }}" "${{ needs.sast.result }}" "${{ needs.sca.result }}" \
                   "${{ needs.secret-scan.result }}" "${{ needs.image-scan.result }}"; do
            if [ "$r" != "success" ]; then echo "GATE CLOSED - image will not be pushed or deployed"; exit 1; fi
          done
          echo "GATE OPEN"

  # 9 --------------------------------------------------------------- push image
  push-image:
    name: 9. push image to GHCR
    needs: [security-gate, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ github.run_number }}
          path: /tmp
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: load the scanned image and push exactly that one
        working-directory: /
        run: |
          docker load -i /tmp/image.tar
          docker tag "$IMAGE:${{ needs.docker-build.outputs.tag }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ needs.docker-build.outputs.tag }}"
          docker push "$IMAGE:latest"

  # 10 ------------------------------------------------------ deploy to kubernetes
  deploy-kubernetes:
    name: 10. deploy to kubernetes (kind on the runner)
    needs: [push-image, docker-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ github.run_number }}
          path: /tmp
      - name: create a kind cluster on the runner
        uses: helm/kind-action@v1
        with: { cluster_name: ci }
      - name: load image into kind and deploy
        run: |
          docker load -i /tmp/image.tar
          kind load docker-image "$IMAGE:${{ needs.docker-build.outputs.tag }}" --name ci
          sed -i "s|:latest|:${{ needs.docker-build.outputs.tag }}|" k8s/deployment.yaml
          kubectl create namespace secure-converter
          kubectl -n secure-converter apply -f k8s/
          kubectl -n secure-converter rollout status deploy/secure-converter --timeout=120s
          kubectl -n secure-converter get pods -o wide
      - name: smoke test through the service
        run: |
          kubectl -n secure-converter port-forward svc/secure-converter 8080:80 >/dev/null 2>&1 &
          sleep 3
          curl -fs localhost:8080/health; echo
          curl -fs -X POST localhost:8080/convert -H 'content-type: application/json' \
               -d '{"category":"temperature","value":100,"from_unit":"c","to_unit":"f"}'; echo
          curl -fs localhost:8080/history; echo
          echo "process runs as uid: $(kubectl -n secure-converter exec deploy/secure-converter -- id -u)"
      - name: summary
        run: |
          {
            echo "## secure-converter deployed"
            echo "- image \`$IMAGE:${{ needs.docker-build.outputs.tag }}\` passed SAST, SCA, secret scan, image scan and the gate"
            echo "- deployed to kind on the runner; the same manifests are applied on my laptop cluster (README)"
          } >> "$GITHUB_STEP_SUMMARY"
