name: Session 16 Final CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "session-16-github-actions/10-final-cicd-pipeline/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "session-16-github-actions/10-final-cicd-pipeline/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: session-16-github-actions/10-final-cicd-pipeline

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: session-16-github-actions/10-final-cicd-pipeline/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v

  security:
    name: Security Check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Reject common secret files
        run: |
          echo "Checking the final project for common secret file types..."
          if find . -type f \( -name ".env" -o -name "*.pem" -o -name "*.key" \) | grep -q .; then
            echo "Potential sensitive file found."
            exit 1
          fi
          echo "No common sensitive files found."

  build:
    name: Build Application
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build application artifact
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: session-16-github-actions/10-final-cicd-pipeline/build/
          retention-days: 7

  delivery:
    name: Package Delivery Artifact
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --tag session16-calculator:${{ github.sha }} .

      - name: Smoke-test container
        run: |
          output=$(printf '2 + 3\nquit\n' | docker run --rm -i session16-calculator:${{ github.sha }})
          echo "$output"
          grep -q "Result: 5.0" <<< "$output"

      - name: Package deployable image
        run: docker save session16-calculator:${{ github.sha }} | gzip > calculator-image.tar.gz

      - name: Upload delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-container-image
          path: session-16-github-actions/10-final-cicd-pipeline/calculator-image.tar.gz
          retention-days: 7
