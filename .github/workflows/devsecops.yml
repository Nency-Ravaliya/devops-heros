name: Python DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  security-events: write

defaults:
  run:
    working-directory: session-17-devsecops/demo

jobs:

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest --cov=app --cov-report=term-missing


  sast:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Analyze code
        uses: github/codeql-action/analyze@v3


  sca:
    name: SCA - Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run dependency scan
        run: |
          pip-audit


  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2


  docker-build:
    name: Docker Build
    needs:
      - test
      - sast
      - sca
      - secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t session17-python:${{ github.sha }} .


  image-scan:
    name: Image Scan - Trivy
    needs:
      - docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t session17-python:${{ github.sha }} .

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan image
        run: |
          trivy image --severity HIGH,CRITICAL --exit-code 1 session17-python:${{ github.sha }}


  security-gate:
    name: Security Gate
    needs:
      - test
      - sast
      - sca
      - secret-scan
      - image-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Security checks passed
        run: |
          echo "========================================"
          echo "       DEVSECOPS SECURITY GATE"
          echo "========================================"
          echo "Unit Tests       : PASSED"
          echo "SAST / CodeQL    : PASSED"
          echo "SCA / pip-audit  : PASSED"
          echo "Secret Scan      : PASSED"
          echo "Trivy Scan       : PASSED"
          echo "========================================"
          echo "SECURITY GATE PASSED"
          echo "========================================"


  push:
    name: Push Image to GHCR
    needs:
      - security-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag image
        run: |
          docker build \
            -t ghcr.io/24f1000397/hey-cicd:${{ github.sha }} \
            -t ghcr.io/24f1000397/hey-cicd:latest \
            .

      - name: Push image
        run: |
          docker push ghcr.io/24f1000397/hey-cicd:${{ github.sha }}
          docker push ghcr.io/24f1000397/hey-cicd:latest


  deploy:
    name: Deploy to Kubernetes
    needs:
      - push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.10.0

      - name: Update deployment with new image tag
        run: |
          sed -i "s|__IMAGE_TAG__|${{ github.sha }}|g" k8s/deployment.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Check rollout status
        run: |
          kubectl rollout status deployment/session17-python --timeout=60s

      - name: Test running website in CI
        run: |
          kubectl port-forward service/session17-python 5001:80 &
          sleep 3
          echo "Fetching the website HTML..."
          curl -s http://localhost:5001 | head -n 15
          echo "Fetching the API status..."
          curl -s http://localhost:5001/api/status