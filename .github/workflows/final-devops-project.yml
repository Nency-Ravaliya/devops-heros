# Session 21 - Final DevOps project: complete CI/CD + DevSecOps + Terraform + Helm + GitOps + Monitoring
#
# Code -> Unit tests -> SAST (Bandit, CodeQL) -> SCA (pip-audit) -> Secret scan (Gitleaks)
#      -> Docker build -> Trivy scan -> Security gate -> Push to GHCR
#      -> Terraform (Kubernetes cluster + ingress + metrics + Prometheus/Grafana + Argo CD)
#      -> GitOps: commit image tag -> Argo CD syncs the Helm chart -> verify, HPA, monitoring
#      -> Troubleshooting challenge -> outputs committed back to the repo
name: Session 21 - Final DevOps Project

on:
  push:
    branches: [main]
    paths:
      - "final-devops-project/application/**"
      - "final-devops-project/docker/**"
      - "final-devops-project/helm/**"
      - "final-devops-project/kubernetes/**"
      - "final-devops-project/terraform/**"
      - "final-devops-project/gitops/**"
      - "final-devops-project/monitoring/**"
      - "final-devops-project/security/**"
      - "final-devops-project/troubleshooting/**"
      - "final-devops-project/scripts/**"
      - ".github/workflows/final-devops-project.yml"
  pull_request:
    branches: [main]
    paths: ["final-devops-project/**"]
  workflow_dispatch: {}

env:
  PROJECT: final-devops-project
  IMAGE: ghcr.io/tejasvarshney/final-notes-api

permissions:
  contents: read

concurrency:
  group: final-project-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===================================================== CI
  test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: final-devops-project/application } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: final-devops-project/application/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: pytest -v --cov=app --cov-report=term-missing --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: final-devops-project/application/test-results.xml }

  sast-bandit:
    name: SAST - Bandit
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install bandit==1.8.6
      - run: bandit -r $PROJECT/application/app --severity-level medium --confidence-level medium

  sast-codeql:
    name: SAST - CodeQL
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: python, source-root: final-devops-project/application }
      - uses: github/codeql-action/analyze@v3

  sca:
    name: SCA - pip-audit
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit==2.9.0
      - run: pip-audit -r $PROJECT/application/requirements.txt --strict

  secret-scan:
    name: Secret scan - Gitleaks
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -v "$PWD/$PROJECT:/src" zricethezav/gitleaks:v8.28.0 \
            dir /src --config /src/security/.gitleaks.toml --redact --verbose --exit-code 1

  # ===================================================== image: build, scan, gate, push
  image:
    name: Docker build, Trivy scan, security gate, push
    needs: [sast-bandit, sast-codeql, sca, secret-scan]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Docker build (multi-stage)
        run: docker build -f $PROJECT/docker/Dockerfile --build-arg APP_VERSION=${{ steps.tag.outputs.tag }} -t $IMAGE:${{ steps.tag.outputs.tag }} $PROJECT/application
      - name: Trivy - report HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}", severity: "HIGH,CRITICAL", exit-code: "0" }
      - name: Security gate - fail on fixable CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}", severity: CRITICAL, ignore-unfixed: true, exit-code: "1", skip-setup-trivy: true }
      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push $IMAGE:${{ steps.tag.outputs.tag }}
      - name: Save image for the deploy job
        run: docker save $IMAGE:${{ steps.tag.outputs.tag }} | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with: { name: image, path: image.tar.gz, retention-days: 1 }

  # ===================================================== infrastructure + GitOps deploy + verification
  deploy:
    name: Terraform + GitOps deploy + verify + troubleshooting
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: write }       # push the GitOps branch and commit outputs
    env:
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.13.3, terraform_wrapper: false }
      - name: Install kind CLI (to load the image into the cluster)
        run: |
          curl -sSLo kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
      - uses: actions/download-artifact@v4
        with: { name: image }
      - name: Terraform - provision cluster + platform
        run: bash $PROJECT/scripts/terraform-apply.sh
      - name: GitOps deploy with Argo CD + verification
        run: bash $PROJECT/scripts/deploy-and-verify.sh
      - name: Troubleshooting challenge
        run: bash $PROJECT/troubleshooting/challenge.sh
      - name: Commit outputs back to main
        if: always()
        run: |
          echo "GitHub Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (image tag $TAG)" > $PROJECT/outputs/00-run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -A $PROJECT/outputs $PROJECT/terraform/.terraform.lock.hcl
          git commit -m "CI: final project outputs [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
