name: 24BCS10070 Session 17 CI and CD
on:
  push:
    branches: [main, 24BCS10070-all-assignments]
    paths: ['devops-homework/session-17-devsecops/**', '.github/workflows/session17-devsecops.yml']
  pull_request:
    paths: ['devops-homework/session-17-devsecops/**', '.github/workflows/session17-devsecops.yml']
  workflow_dispatch:
    inputs:
      deploy: {description: Deploy to the configured practice cluster, type: boolean, default: false}
permissions: {contents: read}
defaults:
  run:
    shell: bash
concurrency:
  group: session17-${{ github.ref }}
  cancel-in-progress: false
env:
  APP_DIR: devops-homework/session-17-devsecops
jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Unit tests and syntax check
        run: |
          cd "$APP_DIR"
          python -m unittest -v 2>&1 | tee test-results.txt
          python -m py_compile app.py
      - uses: actions/upload-artifact@v4
        with:
          name: session17-test-results
          path: ${{ env.APP_DIR }}/test-results.txt
      - name: Install security tools
        run: pip install bandit pip-audit
      - name: SAST
        run: bandit -r "$APP_DIR/app.py" -c "$APP_DIR/security/bandit.yaml"
      - name: SCA
        run: pip-audit -r "$APP_DIR/requirements.txt"
      - name: Secret and filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ${{ env.APP_DIR }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
      - id: image
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}-session17:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: docker build -t '${{ steps.image.outputs.value }}' "$APP_DIR"
      - name: Container security gate
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image.outputs.value }}
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: docker/login-action@v3
        if: github.repository == 'chinna-328/devops-heros' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.repository == 'chinna-328/devops-heros' && github.event_name != 'pull_request'
        run: docker push '${{ steps.image.outputs.value }}'
  deploy:
    if: github.repository == 'chinna-328/devops-heros' && github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: test-build
    environment: practice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Deploy exact tested image
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          IMAGE: ${{ needs.test-build.outputs.image }}
        run: |
          umask 077
          printf '%s' "$KUBE_CONFIG" > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl create namespace student17 --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n student17 apply -f "$APP_DIR/kubernetes/service.yaml"
          kubectl set image --local -f "$APP_DIR/kubernetes/deployment.yaml" app="$IMAGE" -o yaml | kubectl -n student17 apply -f -
          kubectl -n student17 rollout status deployment/pipeline17 --timeout=180s
