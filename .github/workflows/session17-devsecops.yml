# Session 17 — Complete CI/CD + DevSecOps pipeline
# Code → Build → Unit Test → SAST → SCA → Secret Scan → Docker Build
#      → Image Scan → Security Gate → Push Image (GHCR) → Deploy to Kubernetes (kind)
# Author: Chhavi Ahlawat (24BCS10201)

name: Session 17 - DevSecOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - "session-17-devsecops/demo/**"
      - ".github/workflows/session17-devsecops.yml"
  workflow_dispatch:

env:
  APP_DIR: session-17-devsecops/demo
  IMAGE_NAME: ghcr.io/chhavi07-arch/session17-devsecops
  IMAGE_TAG: ${{ github.sha }}

defaults:
  run:
    working-directory: session-17-devsecops/demo

permissions:
  contents: read

jobs:
  # 1. Build + Unit Test
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall -q app
      - name: Run unit tests
        run: pytest -v --cov=app --cov-report=term-missing

  # 2. SAST — Bandit (static analysis of Python source)
  sast:
    name: SAST - Bandit
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: pip install bandit
      - name: Full report (all findings, informational)
        run: bandit -r app -f txt -o bandit-report.txt --exit-zero && cat bandit-report.txt
      - name: Gate - fail on HIGH severity + HIGH confidence
        run: bandit -r app --severity-level high --confidence-level high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: ${{ env.APP_DIR }}/bandit-report.txt

  # 3. SCA — pip-audit (known CVEs in dependencies)
  sca:
    name: SCA - pip-audit
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Scan dependencies (fails on any known vulnerability)
        run: pip-audit -r requirements.txt -r requirements-dev.txt --strict --desc

  # 4. Secret Scan — Gitleaks CLI (scoped to the app folder)
  secret-scan:
    name: Secret Scan - Gitleaks
    needs: sca
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v4
      - name: Install Gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan for hard-coded secrets
        run: /tmp/gitleaks dir . --redact --verbose --exit-code 1

  # 5. Docker Build — build once, hand the image to later jobs as an artifact
  docker-build:
    name: Docker Build
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          outputs: type=docker,dest=/tmp/image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # 6. Container Image Scan — Trivy (report only)
  image-scan:
    name: Image Scan - Trivy
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - name: Install Trivy
        working-directory: /tmp
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y -qq trivy
      - name: Scan image (all severities, report only)
        working-directory: /tmp
        run: trivy image --input /tmp/image.tar --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 0 --format table --output trivy-report.txt && cat trivy-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: /tmp/trivy-report.txt

  # 7. Security Gate — block the release on fixable HIGH/CRITICAL CVEs
  security-gate:
    name: Security Gate
    needs: image-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - name: Install Trivy
        working-directory: /tmp
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y -qq trivy
      - name: Gate - fail on fixable HIGH/CRITICAL vulnerabilities
        working-directory: /tmp
        run: trivy image --input /tmp/image.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: Gate passed
        working-directory: /tmp
        run: echo "All security checks passed (tests, SAST, SCA, secrets, image scan) - image approved for release"

  # 8. Push Image — GitHub Container Registry
  push-image:
    name: Push Image to GHCR
    needs: security-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load, tag and push
        working-directory: /tmp
        run: |
          docker load -i /tmp/image.tar
          docker tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:latest"

  # 9. Deploy — kind cluster inside the runner
  deploy:
    name: Deploy to Kubernetes (kind)
    needs: push-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: devsecops
      - name: Load image into kind
        run: |
          docker load -i /tmp/image.tar
          kind load docker-image "$IMAGE_NAME:$IMAGE_TAG" --name devsecops
      - name: Point manifest at the scanned image
        run: |
          sed -i -e "s|image: .*|image: $IMAGE_NAME:$IMAGE_TAG|" \
                 -e "s|imagePullPolicy: Always|imagePullPolicy: IfNotPresent|" k8s/deployment.yaml
          grep -n "image" k8s/deployment.yaml
      - name: Deploy
        run: kubectl apply -f k8s/
      - name: Wait for rollout
        run: kubectl rollout status deployment/session17-python --timeout=120s
      - name: Verify
        run: |
          kubectl get deploy,pods,svc -o wide
          kubectl port-forward service/session17-python 5001:80 >/dev/null 2>&1 &
          sleep 5
          curl -sf http://localhost:5001/health
          echo
          curl -sf http://localhost:5001/api/status
