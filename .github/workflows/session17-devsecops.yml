# Session 17 - Complete CI/CD + DevSecOps pipeline
#
#   Code → Build → Unit Test → SAST → SCA → Secret Scan → Docker Build
#        → Container Image Scan → Security Gate → Push Image → Deploy to Kubernetes
#
# Every stage is a job that `needs` the previous one, so a failing check stops
# everything after it. The Security Gate job then makes the final go / no-go
# decision before anything leaves CI (push to GHCR, deploy to Kubernetes).
name: Session 17 - DevSecOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - "session-17-devsecops/demo/**"
      - ".github/workflows/session17-devsecops.yml"
  pull_request:
    branches: [main]
    paths:
      - "session-17-devsecops/demo/**"
      - ".github/workflows/session17-devsecops.yml"
  workflow_dispatch:

env:
  APP_DIR: session-17-devsecops/demo
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/jenyyy4/session17-devsecops
  TRIVY_IMAGE: aquasec/trivy:0.75.0
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1

permissions:
  contents: read

defaults:
  run:
    working-directory: session-17-devsecops/demo

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. BUILD — install dependencies and byte-compile the app
  # ─────────────────────────────────────────────────────────
  build:
    name: 1. Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall -q app && echo "✅ app/ compiled"

      - name: Import check (app object loads)
        run: python -c "from app.app import app; print('✅ Flask app loaded:', app.name, '| routes:', len(list(app.url_map.iter_rules())))"

  # ─────────────────────────────────────────────────────────
  # 2. UNIT TEST — pytest with a coverage threshold
  # ─────────────────────────────────────────────────────────
  unit-test:
    name: 2. Unit Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests (fail under 80% coverage)
        run: |
          mkdir -p reports
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml:reports/coverage.xml \
                 --cov-fail-under=80 --junitxml=reports/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: ${{ env.APP_DIR }}/reports/

  # ─────────────────────────────────────────────────────────
  # 3. SAST — Bandit (gating) + CodeQL (results in Security tab)
  # ─────────────────────────────────────────────────────────
  sast:
    name: 3. SAST (Bandit + CodeQL)
    needs: unit-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install -r requirements-security.txt "bandit[sarif]"

      - name: Bandit report (all severities, for the record)
        run: |
          mkdir -p reports
          bandit -c bandit.yaml -r app -f sarif -o reports/bandit.sarif --exit-zero
          bandit -c bandit.yaml -r app -f json -o reports/bandit.json --exit-zero

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          source-root: ${{ env.APP_DIR }}

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: session17-codeql

      - name: Upload Bandit SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.APP_DIR }}/reports/bandit.sarif
          category: session17-bandit

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sast-reports
          path: ${{ env.APP_DIR }}/reports/

      # GATE: any MEDIUM+ severity finding with MEDIUM+ confidence fails the job
      - name: Bandit gate (fail on MEDIUM+)
        run: bandit -c bandit.yaml -r app -ll -ii

  # ─────────────────────────────────────────────────────────
  # 4. SCA — pip-audit against the OSV / PyPA advisory database
  # ─────────────────────────────────────────────────────────
  sca:
    name: 4. SCA (pip-audit)
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install -r requirements-security.txt

      # GATE: any known vulnerability in a runtime or dev dependency fails the job
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt --strict --desc on

      - name: Audit dev/test dependencies
        run: pip-audit -r requirements-dev.txt --strict --desc on

  # ─────────────────────────────────────────────────────────
  # 5. SECRET SCAN — Gitleaks on the working tree and the git history
  # ─────────────────────────────────────────────────────────
  secret-scan:
    name: 5. Secret Scan (Gitleaks)
    needs: sca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history: a secret deleted in a later commit is still leaked

      # GATE: any secret found fails the job (gitleaks exits 1)
      - name: Scan working tree
        working-directory: .
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            dir "/repo/$APP_DIR" --config "/repo/$APP_DIR/.gitleaks.toml" --redact --no-banner -v

      - name: Scan git history of the project
        working-directory: .
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            git /repo --config "/repo/$APP_DIR/.gitleaks.toml" --log-opts="-- $APP_DIR" --redact --no-banner -v

  # ─────────────────────────────────────────────────────────
  # 6. DOCKER BUILD — build once, hand the exact image to later jobs
  # ─────────────────────────────────────────────────────────
  docker-build:
    name: 6. Docker Build
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build --build-arg GIT_SHA=${{ github.sha }} \
            -t "$IMAGE_NAME:${{ github.sha }}" .
          docker image ls "$IMAGE_NAME"

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 5001:5001 "$IMAGE_NAME:${{ github.sha }}"
          for _ in $(seq 1 15); do curl -fsS http://localhost:5001/health && break; sleep 1; done
          echo; curl -fsS http://localhost:5001/api/status; echo
          echo "user inside container: $(docker exec smoke id)"
          docker rm -f smoke

      - name: Save image as artifact
        run: docker save "$IMAGE_NAME:${{ github.sha }}" | gzip > image.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: ${{ env.APP_DIR }}/image.tar.gz
          retention-days: 1

  # ─────────────────────────────────────────────────────────
  # 7. CONTAINER IMAGE SCAN — Trivy (image CVEs + Dockerfile/K8s misconfig)
  # ─────────────────────────────────────────────────────────
  image-scan:
    name: 7. Container Image Scan (Trivy)
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: ${{ env.APP_DIR }}

      - name: Load image
        run: docker load < image.tar.gz

      - name: Trivy report (all severities, SARIF + table)
        run: |
          mkdir -p reports
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" -w /src "$TRIVY_IMAGE" \
            image --format sarif --output reports/trivy-image.sarif "$IMAGE_NAME:${{ github.sha }}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity LOW,MEDIUM,HIGH,CRITICAL "$IMAGE_NAME:${{ github.sha }}"

      - name: Upload Trivy SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.APP_DIR }}/reports/trivy-image.sarif
          category: session17-trivy

      # GATE: HIGH/CRITICAL CVEs with an available fix → exit 1 (policy in trivy.yaml)
      - name: Trivy image gate
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" -w /src "$TRIVY_IMAGE" \
            --config trivy.yaml image "$IMAGE_NAME:${{ github.sha }}"

      # GATE: HIGH/CRITICAL misconfigurations in Dockerfile and Kubernetes manifests
      - name: Trivy config gate (Dockerfile + k8s/)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" \
            config --severity HIGH,CRITICAL --exit-code 1 .

  # ─────────────────────────────────────────────────────────
  # 8. SECURITY GATE — single go / no-go decision for release
  # ─────────────────────────────────────────────────────────
  security-gate:
    name: 8. Security Gate
    needs: [build, unit-test, sast, sca, secret-scan, docker-build, image-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        working-directory: .
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "## 🔐 Security Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for job in build unit-test sast sca secret-scan docker-build image-scan; do
            result=$(echo "$RESULTS" | jq -r --arg j "$job" '.[$j].result')
            if [ "$result" = "success" ]; then icon="✅"; else icon="❌"; failed=1; fi
            printf "%-14s %s %s\n" "$job" "$icon" "$result"
            echo "| \`$job\` | $icon $result |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$failed" -ne 0 ]; then
            echo "**Decision: ⛔ BLOCKED — image will not be pushed or deployed**" >> "$GITHUB_STEP_SUMMARY"
            echo "⛔ SECURITY GATE: FAILED — release blocked"; exit 1
          fi
          echo "**Decision: ✅ PASSED — image may be pushed and deployed**" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ SECURITY GATE: PASSED — all checks green"

  # ─────────────────────────────────────────────────────────
  # 9. PUSH IMAGE — the exact scanned image goes to GHCR (main only)
  # ─────────────────────────────────────────────────────────
  push:
    name: 9. Push Image (GHCR)
    needs: security-gate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: .

      - name: Load image
        working-directory: .
        run: docker load < image.tar.gz

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        id: push
        working-directory: .
        run: |
          docker tag "$IMAGE_NAME:${{ github.sha }}" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_NAME:${{ github.sha }}")
          echo "Pushed: $IMAGE_NAME:${{ github.sha }}"
          echo "Digest: $digest"
          echo "image=$IMAGE_NAME:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "### 📦 Pushed \`$IMAGE_NAME:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$digest\`" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────
  # 10. DEPLOY — kind cluster on the runner, pulls the image from GHCR
  # ─────────────────────────────────────────────────────────
  deploy:
    name: 10. Deploy to Kubernetes
    needs: push
    runs-on: ubuntu-latest
    environment:
      name: development
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: session17

      - name: Pin image to this commit
        working-directory: ${{ env.APP_DIR }}/k8s
        run: |
          kustomize edit set image "$IMAGE_NAME=${{ needs.push.outputs.image }}"
          kubectl kustomize . | grep "image:"

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          # Pull secret so the cluster can pull from GHCR even if the package is private
          kubectl -n devsecops create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n devsecops patch serviceaccount default -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'
          kubectl apply -k k8s/

      - name: Wait for rollout
        run: kubectl -n devsecops rollout status deployment/session17-python --timeout=120s

      - name: Verify deployment
        run: |
          kubectl -n devsecops get deploy,rs,pods,svc -o wide
          kubectl -n devsecops get pods -o jsonpath='{range .items[*]}{.metadata.name}{"  "}{.spec.containers[0].image}{"\n"}{end}'

      - name: Smoke test through the Service
        run: |
          kubectl -n devsecops port-forward svc/session17-python 8080:80 >/dev/null 2>&1 &
          sleep 3
          curl -fsS http://localhost:8080/health; echo
          curl -fsS http://localhost:8080/api/status | tee status.json; echo
          grep -q '"git_sha":"${{ github.sha }}"' status.json && echo "✅ running commit ${{ github.sha }}"
