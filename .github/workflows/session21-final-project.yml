name: Session 21 Final Project

on:
  push:
    branches: [main]
    paths:
      - "session21-final-devops-project/**"
      - ".github/workflows/session21-final-project.yml"
  pull_request:
    branches: [main]
    paths:
      - "session21-final-devops-project/**"
      - ".github/workflows/session21-final-project.yml"

permissions:
  contents: read
  packages: write

env:
  PROJECT_DIR: session21-final-devops-project

jobs:
  test:
    name: Test backend and build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: session21-final-devops-project/backend/requirements.txt
      - name: Test backend
        run: |
          pip install -r requirements.txt
          pytest -q
        working-directory: ${{ env.PROJECT_DIR }}/backend
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: session21-final-devops-project/frontend/package-lock.json
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: ${{ env.PROJECT_DIR }}/frontend

  security:
    name: Source and dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bandit SAST
        run: pip install bandit && bandit -r app -lll
        working-directory: ${{ env.PROJECT_DIR }}/backend
      - name: Python SCA
        run: pip install pip-audit && pip-audit -r requirements.txt
        working-directory: ${{ env.PROJECT_DIR }}/backend
      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 \
            detect --no-git --redact --source /repo/session21-final-devops-project

  helm:
    name: Lint and render Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint "$PROJECT_DIR/helm/labtrack"
      - run: helm template labtrack "$PROJECT_DIR/helm/labtrack" > rendered-labtrack.yaml
      - uses: actions/upload-artifact@v7
        with:
          name: labtrack-rendered-manifests
          path: rendered-labtrack.yaml

  images:
    name: Build and scan images
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          docker build -t labtrack-backend:${GITHUB_SHA} "$PROJECT_DIR/backend"
          docker build -t labtrack-frontend:${GITHUB_SHA} "$PROJECT_DIR/frontend"
          test "$(docker image inspect labtrack-backend:${GITHUB_SHA} --format '{{.Config.User}}')" = "10001"
          test "$(docker image inspect labtrack-frontend:${GITHUB_SHA} --format '{{.Config.User}}')" = "101"
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: labtrack-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: labtrack-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested images to GHCR
        if: github.event_name == 'push'
        run: |
          backend="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/labtrack-backend"
          frontend="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/labtrack-frontend"
          docker tag "labtrack-backend:${GITHUB_SHA}" "$backend:${GITHUB_SHA}"
          docker tag "labtrack-backend:${GITHUB_SHA}" "$backend:latest"
          docker tag "labtrack-frontend:${GITHUB_SHA}" "$frontend:${GITHUB_SHA}"
          docker tag "labtrack-frontend:${GITHUB_SHA}" "$frontend:latest"
          docker push "$backend:${GITHUB_SHA}"
          docker push "$backend:latest"
          docker push "$frontend:${GITHUB_SHA}"
          docker push "$frontend:latest"

  deploy:
    name: Deploy to Kind and smoke test
    needs: [images, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1.15.0
        with:
          cluster_name: labtrack
      - name: Build and load images
        run: |
          docker build -t labtrack-backend:ci "$PROJECT_DIR/backend"
          docker build -t labtrack-frontend:ci "$PROJECT_DIR/frontend"
          kind load docker-image labtrack-backend:ci labtrack-frontend:ci --name labtrack
      - name: Install chart
        run: |
          helm upgrade --install labtrack "$PROJECT_DIR/helm/labtrack" \
            --namespace labtrack --create-namespace \
            --set backend.image=labtrack-backend \
            --set backend.tag=ci \
            --set frontend.image=labtrack-frontend \
            --set frontend.tag=ci \
            --set hpa.enabled=false \
            --set monitoring.serviceMonitor.enabled=false \
            --set postgres.persistence.enabled=false
          kubectl rollout status deployment/labtrack-postgres -n labtrack --timeout=120s
          kubectl rollout status deployment/labtrack-labtrack-backend -n labtrack --timeout=120s
          kubectl rollout status deployment/labtrack-frontend -n labtrack --timeout=120s
      - name: Smoke test through frontend proxy
        run: |
          kubectl port-forward service/frontend -n labtrack 3000:80 >/tmp/labtrack-port-forward.log 2>&1 &
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:3000/health && exit 0
            sleep 3
          done
          kubectl get all -n labtrack
          exit 1
