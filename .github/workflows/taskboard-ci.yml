name: TaskBoard Python CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  REGISTRY: ghcr.io
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: session21-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: session21-python/backend
        run: pip install -r requirements.txt
      - name: Run backend tests
        working-directory: session21-python/backend
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend
        working-directory: session21-python/frontend
        run: npm install && npm run build

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/taskboard-backend:${{ github.sha }} session21-python/backend
          docker build -t ghcr.io/${{ github.repository_owner }}/taskboard-frontend:${{ github.sha }} session21-python/frontend
      - name: Scan backend
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/taskboard-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/taskboard-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/taskboard-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/taskboard-frontend:${{ github.sha }}

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Deploy with Helm when a cluster kubeconfig secret exists
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "KUBE_CONFIG_DATA is not set. Skipping the cluster deploy."
            echo "Add that repository secret after terraform creates the EKS cluster."
            exit 0
          fi
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          helm upgrade --install taskboard session21-python/helm/taskboard -n taskboard --create-namespace \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            --set backend.image=ghcr.io/${{ github.repository_owner }}/taskboard-backend \
            --set frontend.image=ghcr.io/${{ github.repository_owner }}/taskboard-frontend
