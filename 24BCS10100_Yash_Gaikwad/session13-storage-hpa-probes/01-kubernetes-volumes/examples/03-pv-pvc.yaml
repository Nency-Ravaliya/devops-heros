# Example 3: static provisioning - PersistentVolume + PersistentVolumeClaim + Pod.
#
# 1. The admin side: a PV backed by a hostPath directory on the node.
# 2. The user side: a PVC that asks for storage.
# 3. A Pod that mounts the PVC (never the PV directly).
#
# Both the PV and the PVC use storageClassName "manual". minikube has a default
# StorageClass called "standard"; a PVC with NO storageClassName would be given
# that default class and dynamically provisioned instead of binding to this PV.
# "manual" is just a label that pairs the two objects - no StorageClass object
# with that name is needed for static binding.
#
# /data is one of the directories minikube keeps across restarts.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: vol-static-pv
  labels:
    type: local
spec:
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/vol-static-pv
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vol-static-pvc
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 500Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: vol-static-pvc-pod
  labels:
    app: vol-static-pvc-pod
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c"]
    args:
    - |
      echo "static PV test, written by $HOSTNAME at `date`" >> /mnt/pvc/hello.txt
      cat /mnt/pvc/hello.txt
      sleep 3600
    volumeMounts:
    - name: storage
      mountPath: /mnt/pvc
  volumes:
  - name: storage
    persistentVolumeClaim:
      claimName: vol-static-pvc
