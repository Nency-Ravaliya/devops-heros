# Load generator: three Pods, each running three endless request loops against the Service.
# Deleting this Deployment removes the load.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              for i in 1 2 3; do
                (while true; do wget -q -O- http://hpa-demo-service > /dev/null; done) &
              done
              wait
