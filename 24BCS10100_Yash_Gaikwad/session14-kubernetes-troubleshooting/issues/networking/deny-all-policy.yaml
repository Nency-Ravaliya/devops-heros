# BROKEN (on purpose): a NetworkPolicy that blocks all incoming traffic to the net-web Pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
spec:
  podSelector:
    matchLabels:
      app: net-web
  policyTypes:
    - Ingress # no ingress rules listed = nothing is allowed in
