# BROKEN: the Service forwards to port 8080, but nginx listens on port 80.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: net-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: net-web
  template:
    metadata:
      labels:
        app: net-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: net-web
spec:
  selector:
    app: net-web
  ports:
    - port: 80
      targetPort: 8080 # wrong: the container listens on 80
