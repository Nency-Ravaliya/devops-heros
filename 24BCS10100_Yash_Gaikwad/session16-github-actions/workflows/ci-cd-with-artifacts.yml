name: CI/CD (with artifacts)

# NOT YET RUN ON GITHUB: this is an improved copy of ci-cd.yml (nothing was pushed).
# What is new compared with ci-cd.yml:
#   1. pytest writes a JUnit XML report and the report is uploaded as an artifact
#   2. the built React app (frontend/dist) is uploaded as an artifact
#   3. a small "test-report" job downloads the report again (artifacts passed between jobs)
#      and prints the totals on the run summary page
#
#   CI  = test, secret-scan, validate-infra, test-report, build-scan-push (build + scan)
#   CD  = the push step of build-scan-push (delivery) and the deploy job (deployment)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # CI, gate 1: nothing is built or pushed unless the tests pass
  # ------------------------------------------------------------------
  test:
    name: Test (pytest + frontend build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run pytest (and write a JUnit report)
        working-directory: backend
        run: pytest -v --junitxml=pytest-report.xml

      # always(): the report is most useful when a test FAILED, so upload it either way
      - name: Upload the pytest report as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-junit-report
          path: backend/pytest-report.xml
          if-no-files-found: error
          retention-days: 14

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload the built frontend (dist/) as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------
  # Passing an artifact from one job to another: a different job (and a
  # different runner) downloads the report and summarises it.
  # ------------------------------------------------------------------
  test-report:
    name: Summarise the test report
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the pytest report
        uses: actions/download-artifact@v8
        with:
          name: pytest-junit-report
          path: report

      - name: Write the totals to the run summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          root = ET.parse("report/pytest-report.xml").getroot()
          suite = root if root.tag == "testsuite" else root[0]
          print("### pytest report")
          print("| tests | failures | errors | skipped | seconds |")
          print("|---|---|---|---|---|")
          print("| {} | {} | {} | {} | {} |".format(
              suite.get("tests"), suite.get("failures"), suite.get("errors"),
              suite.get("skipped"), suite.get("time")))
          PY

  # ------------------------------------------------------------------
  # Secret scanning: fails if a password, token or key was committed
  # (anywhere in the history, not only in the latest commit).
  # ------------------------------------------------------------------
  secret-scan:
    name: Scan for committed secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks over the full git history
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact --verbose

  # ------------------------------------------------------------------
  # Infrastructure code is checked on every push too: a broken chart or
  # Terraform file is caught here, not during a deployment.
  # ------------------------------------------------------------------
  validate-infra:
    name: Validate Helm chart and Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Lint and render the Helm chart
        run: |
          helm lint helm/stockpilot
          for values in values-dev.yaml values-eks.yaml; do
            helm template stockpilot helm/stockpilot --namespace stockpilot -f "helm/stockpilot/$values" > /dev/null
          done

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt, init and validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  # ------------------------------------------------------------------
  # CI gate 2 + CD (delivery): build each image, scan it with Trivy, then push it.
  # A HIGH/CRITICAL finding fails the job, so a vulnerable image is never pushed.
  # ------------------------------------------------------------------
  build-scan-push:
    name: Build, scan and push (${{ matrix.service }})
    needs: [test, validate-infra, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    env:
      # fall back to the AWS mirror if the GHCR copy of the Trivy DB is rate limited
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
    steps:
      - uses: actions/checkout@v7

      - name: Work out the image name (GHCR needs lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stockpilot-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          load: true
          push: false
          # the tag is the commit SHA: commit A -> image A, never "latest"
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy (fail on HIGH / CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: docker push "$IMAGE:${{ github.sha }}"

  # ------------------------------------------------------------------
  # CD (deployment): Helm upgrade on EKS. Skipped until the repository
  # variable DEPLOY_ENABLED is set to "true".
  # ------------------------------------------------------------------
  deploy:
    name: Deploy to EKS with Helm
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - uses: azure/setup-helm@v5

      - name: Configure kubectl for the cluster
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME || 'stockpilot-eks' }}" --region "${{ vars.AWS_REGION || 'ap-south-1' }}"

      - name: helm upgrade --install
        env:
          # optional: when the secret is not set, the chart generates and keeps its own password
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          EXTRA_ARGS=()
          if [ -n "$DB_PASSWORD" ]; then
            EXTRA_ARGS+=(--set-string "postgres.password=$DB_PASSWORD")
          fi
          helm upgrade --install stockpilot ./helm/stockpilot \
            --namespace stockpilot --create-namespace \
            --set backend.image.repository="ghcr.io/${OWNER}/stockpilot-backend" \
            --set backend.image.tag="${{ github.sha }}" \
            --set frontend.image.repository="ghcr.io/${OWNER}/stockpilot-frontend" \
            --set frontend.image.tag="${{ github.sha }}" \
            "${EXTRA_ARGS[@]}" \
            --wait --timeout 5m

      - name: Show what is running
        run: |
          kubectl get pods -n stockpilot
          helm list -n stockpilot
