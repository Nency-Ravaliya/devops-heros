apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stockpilot.fullname" . }}-frontend-config
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  # nginx proxies /api to this URL (the backend Service) when the page is opened without going
  # through the Ingress. nginx does not use the pod's DNS search domains, so the name must be
  # fully qualified.
  BACKEND_URL: "http://{{ include "stockpilot.fullname" . }}-backend.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}:{{ .Values.backend.service.port }}"
