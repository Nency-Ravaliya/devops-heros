{{- /*
Database credentials. Nothing secret is stored in Git:
  - postgres.password set     -> that value is used
  - postgres.password empty   -> the password already stored in the cluster is reused, or a
                                 random one is generated on the very first install
PostgreSQL only reads POSTGRES_PASSWORD when it first initialises its volume, so keeping the
value stable across `helm upgrade` is what stops the backend and the database drifting apart.
*/ -}}
{{- $secretName := include "stockpilot.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := .Values.postgres.password -}}
{{- if not $password -}}
  {{- if and $existing (hasKey $existing.data "postgres-password") -}}
    {{- $password = index $existing.data "postgres-password" | b64dec -}}
  {{- else -}}
    {{- $password = randAlphaNum 24 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ $password | quote }}
  database-url: {{ printf "postgresql+psycopg://%s:%s@%s-postgres:5432/%s" .Values.postgres.user ($password | urlquery | replace "+" "%20") (include "stockpilot.fullname" .) .Values.postgres.database | quote }}
  {{- else }}
  database-url: {{ required "backend.externalDatabaseUrl is required when postgres.enabled=false" .Values.backend.externalDatabaseUrl | quote }}
  {{- end }}
