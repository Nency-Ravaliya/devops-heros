# kube-prometheus-stack: Grafana side (the chart bundles Grafana, so these are its "grafana:" values).
# Use together with prometheus-values.yaml.

grafana:
  enabled: true

  # The admin password is generated by the chart. Read it with:
  #   kubectl get secret -n monitoring monitoring-grafana -o jsonpath="{.data.admin-password}" | base64 -d
  adminUser: admin

  # Reach Grafana with:  kubectl port-forward -n monitoring svc/monitoring-grafana 3001:80
  # then open http://localhost:3001
  service:
    type: ClusterIP

  # The sidecar loads every ConfigMap labelled grafana_dashboard=1 (from any namespace) as a
  # dashboard. monitoring/grafana-dashboard.yaml is picked up this way.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

  # Prometheus is added as the default data source automatically.
  defaultDashboardsEnabled: true

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
