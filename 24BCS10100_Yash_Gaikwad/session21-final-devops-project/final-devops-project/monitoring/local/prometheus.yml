global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # the real StockPilot backend (FastAPI + prometheus-fastapi-instrumentator)
  - job_name: stockpilot-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
