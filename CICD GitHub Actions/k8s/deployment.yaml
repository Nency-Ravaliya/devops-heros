apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator
spec:
  replicas: 2
  selector:
    matchLabels: { app: calculator }
  template:
    metadata:
      labels: { app: calculator }
    spec:
      containers:
        - name: calculator
          image: IMAGE_PLACEHOLDER
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
---
apiVersion: v1
kind: Service
metadata:
  name: calculator
spec:
  selector: { app: calculator }
  ports: [{ port: 80, targetPort: 8000 }]
