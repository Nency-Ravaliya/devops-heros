apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-canary
      track: canary
  template:
    metadata:
      labels:
        app: web-canary
        track: canary
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args: ["-text=CANARY v2", "-listen=:8080"]
          ports:
            - containerPort: 8080
