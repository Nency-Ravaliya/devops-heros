# EXAMPLE ONLY - placeholder values. The real Secret is created with
# `kubectl create secret generic` (see README) so real credentials never land in Git.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:            # plain text here; the API server stores it base64-encoded in .data
  DB_USER: "app_user"
  DB_PASSWORD: "change-me"
