# PostgreSQL initialised with the CORRECT password (stringData has no trailing newline)
apiVersion: v1
kind: Secret
metadata:
  name: pg-server
type: Opaque
stringData:
  POSTGRES_PASSWORD: "mypassword"     # demo-only training value
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: yatri_admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: pg-server, key: POSTGRES_PASSWORD }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "yatri_admin"]
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
