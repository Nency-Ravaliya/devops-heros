# hostPath: mounts a directory of the NODE's filesystem into the Pod
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"written by $(hostname) at $(date +%T)\" >> /host-data/visits.txt; sleep 3600"]
      volumeMounts:
        - name: node-dir
          mountPath: /host-data
  volumes:
    - name: node-dir
      hostPath:
        path: /tmp/hostpath-demo
        type: DirectoryOrCreate
