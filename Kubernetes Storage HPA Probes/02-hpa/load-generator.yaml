# In-cluster load generator: 4 Pods, each firing requests in a tight loop.
# (Avoids the kubectl port-forward bottleneck of a laptop-side script.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 4
  selector:
    matchLabels: { app: load-generator }
  template:
    metadata:
      labels: { app: load-generator }
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O- http://yatri-backend-service > /dev/null; done"]
