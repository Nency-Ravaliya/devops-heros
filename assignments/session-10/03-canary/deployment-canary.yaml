apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-canary
  labels:
    app: myapp-canary
    track: canary
    version: v2
spec:
  # 1 canary pod = 10% of traffic (1 out of 10 total pods)
  # To increase canary traffic: scale up this deployment and scale down stable
  #   e.g. 10% -> scale canary to 1 replicas (1/10 total)
  #        20% -> scale canary to 2 replicas (2/10 total)
  #        50% -> scale canary to 5 replicas (5/10 total)
  replicas: 1
  selector:
    matchLabels:
      app: myapp-canary
      track: canary
  template:
    metadata:
      labels:
        app: myapp-canary
        track: canary
        version: v2
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    echo '<html><body style="background:#7b2d00;color:#ffd60a;font-family:monospace;font-size:3em;text-align:center;padding-top:20vh">
                    <p>CANARY v2</p>
                    <p style="font-size:0.4em;color:#ff9f1c">Track: canary | 10% of traffic (1 of 10 pods)</p>
                    </body></html>' > /usr/share/nginx/html/index.html
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "80m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
