name: Complete DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: 1. Code & Unit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - run: |
        python -m pip install --upgrade pip
        pip install -r assignments/session-17/requirements.txt
    - name: Run Unit Tests
      run: PYTHONPATH=assignments/session-17 pytest assignments/session-17/tests/

  sast-scan:
    name: 2. SAST (Static Analysis - Bandit)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - run: pip install bandit
    - name: Run Bandit SAST Scan
      run: bandit -r assignments/session-17/app/ -f txt

  sca-scan:
    name: 3. SCA (Dependency Scan - Safety)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - run: pip install safety
    - name: Run Safety SCA Scan
      run: safety check -r assignments/session-17/requirements.txt

  secret-scan:
    name: 4. Secret Scanning (Trufflehog)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: TruffleHog Secret Scan
      uses: trufflesecurity/trufflehog-actions-scan@v3.0.0
      with:
        path: ./assignments/session-17

  container-security-gate:
    name: 5. Container Image Scan & Security Gate (Trivy)
    needs: [sast-scan, sca-scan, secret-scan]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build Local Image
      run: docker build -t devsecops-demo:latest assignments/session-17/
    - name: Run Trivy Image Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'devsecops-demo:latest'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

  deploy-k8s:
    name: 6. Kubernetes Deployment
    needs: container-security-gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3
    - name: Verify K8s Manifests
      run: |
        kubectl apply --dry-run=client -f assignments/session-17/k8s/deployment.yaml
        kubectl apply --dry-run=client -f assignments/session-17/k8s/service.yaml
