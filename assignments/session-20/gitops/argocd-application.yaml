apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-webapp-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/raghav095/devops-heros.git
    targetRevision: HEAD
    path: assignments/session-20/gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
