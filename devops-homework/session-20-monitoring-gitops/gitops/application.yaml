{
  "apiVersion": "argoproj.io/v1alpha1",
  "kind": "Application",
  "metadata": {
    "name": "student20",
    "namespace": "argocd"
  },
  "spec": {
    "project": "default",
    "source": {
      "repoURL": "https://github.com/chinna-328/devops-heros.git",
      "targetRevision": "24BCS10070-all-assignments",
      "path": "devops-homework/session-20-monitoring-gitops/gitops/manifests"
    },
    "destination": {
      "server": "https://kubernetes.default.svc",
      "namespace": "student20"
    },
    "syncPolicy": {
      "automated": {
        "prune": true,
        "selfHeal": true
      },
      "syncOptions": [
        "CreateNamespace=true"
      ]
    }
  }
}
