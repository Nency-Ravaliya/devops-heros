name: queuedesk
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: queuedesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-queuedesk-local-only}
      POSTGRES_DB: queuedesk
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U queuedesk -d queuedesk']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: ./backend
    image: queuedesk-backend:local
    command: [alembic, upgrade, head]
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://queuedesk:${POSTGRES_PASSWORD:-queuedesk-local-only}@postgres:5432/queuedesk
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build: ./backend
    image: queuedesk-backend:local
    environment: *backend-env
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8000}:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  frontend:
    build: ./frontend
    image: queuedesk-frontend:local
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3000}:8080'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/nginx-health]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
