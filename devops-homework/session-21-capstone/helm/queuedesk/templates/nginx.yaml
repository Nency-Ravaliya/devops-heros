apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "queuedesk.name" . }}-nginx
  labels:
    {{- include "queuedesk.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      server_tokens off;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      location = /nginx-health { access_log off; return 200 'healthy'; }
      location /api/ {
        proxy_pass http://{{ include "queuedesk.name" . }}-backend:8000;
        proxy_set_header Host $host;
      }
      location / { try_files $uri $uri/ /index.html; }
    }
