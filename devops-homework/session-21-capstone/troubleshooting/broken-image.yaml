apiVersion: v1
kind: Namespace
metadata:
  name: queuedesk-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-lab
  namespace: queuedesk-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: image-lab}
  template:
    metadata:
      labels: {app: image-lab}
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:this-tag-does-not-exist
          ports:
            - {containerPort: 8080}
