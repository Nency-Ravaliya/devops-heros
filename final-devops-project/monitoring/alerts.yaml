apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: notes-api-alerts
  namespace: notes
spec:
  groups:
    - name: notes-api.rules
      rules:
        - alert: NotesApiDown
          expr: sum(up{namespace="notes", service="notes-api"}) < 1
          for: 1m
          labels: { severity: critical }
          annotations: { summary: "No notes-api Pod is being scraped successfully" }
        - alert: NotesApiHighErrorRate
          expr: sum(rate(notes_http_requests_total{namespace="notes", status=~"5.."}[2m])) / sum(rate(notes_http_requests_total{namespace="notes"}[2m])) > 0.05
          for: 2m
          labels: { severity: warning }
          annotations: { summary: "More than 5% of notes-api requests fail" }
        - alert: NotesApiHighLatency
          expr: histogram_quantile(0.95, sum by (le) (rate(notes_http_request_duration_seconds_bucket{namespace="notes"}[5m]))) > 0.5
          for: 5m
          labels: { severity: warning }
          annotations: { summary: "p95 latency above 500ms" }
