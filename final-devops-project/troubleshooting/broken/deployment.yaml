# BUG 1: image tag typo   BUG 2: wrong Secret key   BUG 4: no resource requests (HPA cannot compute %)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: notes-api }
  template:
    metadata:
      labels: { app: notes-api }
    spec:
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER_TYPO
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: notes-config }
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: notes-redis-auth, key: redis-password }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
