apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: color-web
      version: blue
  template:
    metadata:
      labels:
        app: color-web
        version: blue
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: color-web
      version: green
  template:
    metadata:
      labels:
        app: color-web
        version: green
    spec:
      containers:
        - name: web
          image: httpd:2.4-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: color-web
spec:
  selector:
    app: color-web
    version: blue
  ports:
    - port: 80
      targetPort: 80
