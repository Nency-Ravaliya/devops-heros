apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  DB_PASSWORD: example-only-do-not-use
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo password-length=$(wc -c < /etc/secret/password); sleep 3600"]
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD
      volumeMounts:
        - name: secret-file
          mountPath: /etc/secret
          readOnly: true
  volumes:
    - name: secret-file
      secret:
        secretName: app-secret
        items:
          - key: DB_PASSWORD
            path: password
