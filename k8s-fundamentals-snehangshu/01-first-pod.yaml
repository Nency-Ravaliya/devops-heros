apiVersion: v1
kind: Pod
metadata:
  name: hello-pod
  labels:
    app: hello
    session: "9"
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 200m
          memory: 64Mi
