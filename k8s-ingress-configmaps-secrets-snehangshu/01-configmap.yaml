apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # simple key/value pairs -> consumed as environment variables
  APP_NAME: "devops-heros-demo"
  APP_ENV: "production"
  LOG_LEVEL: "info"
  # a whole file -> consumed as a mounted volume
  app.properties: |
    server.port=8080
    server.name=devops-heros
    feature.newUI=true
