apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-liveness
spec:
  containers:
  - name: liveness-container
    image: busybox:latest
    command: ['sh', '-c', 'touch /tmp/healthy; sleep 15; rm -rf /tmp/healthy; sleep 600']
    livenessProbe:
      exec:
        command:
        - cat
        - /tmp/healthy
      initialDelaySeconds: 5
      periodSeconds: 5