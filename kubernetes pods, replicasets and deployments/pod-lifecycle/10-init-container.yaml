apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-init
spec:
  initContainers:
  - name: init-service
    image: busybox:latest
    command: ['sh', '-c', 'echo "Running pre-check..."; sleep 2']
  containers:
  - name: app-container
    image: busybox:latest
    command: ['sh', '-c', 'echo "App initialized" && sleep 3600']