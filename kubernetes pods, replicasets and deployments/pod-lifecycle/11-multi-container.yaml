apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-multi-container
spec:
  volumes:
  - name: shared-logs
    emptyDir: {}
  containers:
  - name: main-app
    image: busybox:latest
    command: ['sh', '-c', 'while true; do echo "App log at $(date)" >> /var/log/app.log; sleep 2; done']
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log
  - name: sidecar
    image: busybox:latest
    command: ['sh', '-c', 'tail -f /var/log/app.log']
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log