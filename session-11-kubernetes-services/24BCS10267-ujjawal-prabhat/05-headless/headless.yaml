apiVersion: v1
kind: Service
metadata:
  name: web-headless
  namespace: s11
spec:
  clusterIP: None          # headless: DNS returns the pod IPs directly, no virtual IP / kube-proxy
  selector:
    app: web-sts
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web-sts
  namespace: s11
spec:
  serviceName: web-headless   # gives each pod a stable DNS name: web-sts-N.web-headless.s11.svc.cluster.local
  replicas: 3
  selector:
    matchLabels:
      app: web-sts
  template:
    metadata:
      labels:
        app: web-sts
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
