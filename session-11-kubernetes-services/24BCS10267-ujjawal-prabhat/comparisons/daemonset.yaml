# One pod per (schedulable) node - typical for log shippers / node agents.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: s11
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c", "echo agent on node $NODE_NAME; sleep infinity"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
          resources:
            requests: { cpu: 5m, memory: 8Mi }
