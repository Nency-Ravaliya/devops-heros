apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-web
  labels:
    app: campus-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: campus-web
  template:
    metadata:
      labels:
        app: campus-web
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: campus-web-clusterip
spec:
  type: ClusterIP
  selector:
    app: campus-web
  ports:
    - port: 8080
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: campus-client
  labels:
    app: campus-client
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.5.0
      command: ["sleep", "3600"]
