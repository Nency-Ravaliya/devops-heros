apiVersion: v1
kind: Service
metadata:
  name: campus-headless
spec:
  clusterIP: None
  selector:
    app: campus-stateful
  ports:
    - name: web
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: campus-node
spec:
  serviceName: campus-headless
  replicas: 3
  selector:
    matchLabels:
      app: campus-stateful
  template:
    metadata:
      labels:
        app: campus-stateful
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
