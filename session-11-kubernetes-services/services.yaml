apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-web
  namespace: rudray-devops-hw
spec:
  replicas: 2
  selector:
    matchLabels: {app: service-web}
  template:
    metadata:
      labels: {app: service-web}
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports: [{name: http, containerPort: 80}]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: web-clusterip, namespace: rudray-devops-hw}
spec:
  type: ClusterIP
  selector: {app: service-web}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: web-nodeport, namespace: rudray-devops-hw}
spec:
  type: NodePort
  selector: {app: service-web}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: web-loadbalancer, namespace: rudray-devops-hw}
spec:
  type: LoadBalancer
  selector: {app: service-web}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: external-docs, namespace: rudray-devops-hw}
spec:
  type: ExternalName
  externalName: kubernetes.io
---
apiVersion: v1
kind: Service
metadata: {name: web-headless, namespace: rudray-devops-hw}
spec:
  clusterIP: None
  selector: {app: service-web}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Pod
metadata: {name: network-client, namespace: rudray-devops-hw}
spec:
  containers:
    - name: client
      image: busybox:1.37
      command: [sh, -c, "sleep 86400"]
      resources:
        requests: {cpu: 10m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
