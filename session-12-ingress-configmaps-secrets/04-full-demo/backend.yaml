---
# Backend Deployment — reads ConfigMap + Secret as environment variables
# Uses a simple Python HTTP server to return config values in the response body
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  namespace: default
  labels:
    app: yatri-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
    spec:
      containers:
        - name: backend
          image: python:3.11-alpine3.19
          command:
            - "sh"
            - "-c"
            - |
              python3 -c "
              import os
              from http.server import HTTPServer, BaseHTTPRequestHandler

              class Handler(BaseHTTPRequestHandler):
                  def log_message(self, format, *args):
                      pass
                  def do_GET(self):
                      env     = os.getenv('ENVIRONMENT', 'unknown')
                      log     = os.getenv('LOG_LEVEL',   'unknown')
                      currency= os.getenv('DEFAULT_CURRENCY', 'unknown')
                      db_user = os.getenv('POSTGRES_USER', 'unknown')
                      db_name = os.getenv('POSTGRES_DB',  'unknown')
                      body = (
                          'Yatri Backend API\n'
                          '=================\n'
                          f'ENVIRONMENT     : {env}\n'
                          f'LOG_LEVEL       : {log}\n'
                          f'DEFAULT_CURRENCY: {currency}\n'
                          f'POSTGRES_USER   : {db_user}\n'
                          f'POSTGRES_DB     : {db_name}\n'
                      ).encode()
                      self.send_response(200)
                      self.send_header('Content-Type', 'text/plain')
                      self.send_header('Content-Length', str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

              HTTPServer(('0.0.0.0', 5000), Handler).serve_forever()
              "
          ports:
            - containerPort: 5000
          # Inject plain-text config from ConfigMap
          envFrom:
            - configMapRef:
                name: yatri-app-config
          # Inject sensitive credentials from Secret
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: yatri-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yatri-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: yatri-db-secret
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
# Backend ClusterIP Service
apiVersion: v1
kind: Service
metadata:
  name: yatri-backend-service
  namespace: default
  labels:
    app: yatri-backend
spec:
  type: ClusterIP
  selector:
    app: yatri-backend
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
