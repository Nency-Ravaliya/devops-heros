# ConfigMap "app-config" is created imperatively (see README):
#   kubectl -n s12 create configmap app-config \
#     --from-literal=APP_ENV=staging --from-literal=LOG_LEVEL=debug \
#     --from-file=app.properties
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
  namespace: s12
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"started with CFG_APP_ENV=$CFG_APP_ENV LOG_LEVEL=$LOG_LEVEL\"; sleep infinity"]
      env:
        # 1) single key -> env var with a different name
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOG_LEVEL
      # 2) every key of the ConfigMap -> env vars with a CFG_ prefix
      #    (on k8s >= 1.34 even "app.properties" becomes a variable: relaxed env-var name validation)
      envFrom:
        - configMapRef:
            name: app-config
          prefix: CFG_
      volumeMounts:
        # 3) every key -> a file in /etc/config
        - name: config-vol
          mountPath: /etc/config
          readOnly: true
  volumes:
    - name: config-vol
      configMap:
        name: app-config
