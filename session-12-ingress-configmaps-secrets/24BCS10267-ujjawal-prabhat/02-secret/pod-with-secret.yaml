apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
  namespace: s12
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "infinity"]
      env:
        # Secret key -> env var
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_PASSWORD
      volumeMounts:
        # Secret keys -> files (tmpfs, never written to the node's disk)
        - name: creds
          mountPath: /etc/creds
          readOnly: true
  volumes:
    - name: creds
      secret:
        secretName: db-credentials
        defaultMode: 0400     # owner read-only
