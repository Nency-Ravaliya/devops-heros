# TEMPLATE ONLY - placeholder values, safe to commit.
# The real Secret is never stored in git. It is created from the CLI:
#   kubectl -n s12 create secret generic db-credentials \
#     --from-literal=DB_USER=<user> --from-literal=DB_PASSWORD=<password>
# (or generated by sealed-secrets / external-secrets / SOPS in a real pipeline)
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: s12
type: Opaque
stringData:            # stringData = plain text, the API server base64-encodes it into .data
  DB_USER: "<db-username>"
  DB_PASSWORD: "<db-password>"
