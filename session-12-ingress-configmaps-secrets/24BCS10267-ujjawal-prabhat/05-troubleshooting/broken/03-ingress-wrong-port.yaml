# BROKEN: backend points at service port 8080, but Service app-b only exposes port 80
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wrong-port
  namespace: s12
spec:
  ingressClassName: nginx
  rules:
    - host: port.24bcs10267.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: app-b, port: { number: 8080 } }
