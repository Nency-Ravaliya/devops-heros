# BROKEN: references key "log_level" but the ConfigMap key is "LOG_LEVEL" (keys are case-sensitive)
apiVersion: v1
kind: Pod
metadata:
  name: cm-key-demo
  namespace: s12
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo LOG_LEVEL=$LOG_LEVEL; sleep infinity"]
      env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: log_level
