# FIXED: value produced with  echo -n "mypassword" | base64   (no trailing newline).
# Even better: use stringData (no manual base64 at all) or `kubectl create secret --from-literal`.
apiVersion: v1
kind: Secret
metadata:
  name: app-db-secret
  namespace: s12
type: Opaque
data:
  DB_PASSWORD: bXlwYXNzd29yZA==
---
apiVersion: v1
kind: Pod
metadata:
  name: db-client
  namespace: s12
spec:
  restartPolicy: Never
  containers:
    - name: psql
      image: postgres:16-alpine
      command: ["sh", "-c", "psql -h pg -U yatri_admin -d postgres -c 'select current_user, version();'"]
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef: { name: app-db-secret, key: DB_PASSWORD }
