# PostgreSQL server for troubleshooting case 1 (secret-base64-gotcha).
# Its password Secret is created from the CLI (correct, no newline):
#   kubectl -n s12 create secret generic pg-server-secret --from-literal=POSTGRES_PASSWORD=mypassword
# "mypassword" is the throwaway demo value from the course's troubleshooting/secret-base64-gotcha.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg
  namespace: s12
spec:
  replicas: 1
  selector:
    matchLabels: { app: pg }
  template:
    metadata:
      labels: { app: pg }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: yatri_admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: pg-server-secret, key: POSTGRES_PASSWORD }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "yatri_admin"] }
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: pg
  namespace: s12
spec:
  selector: { app: pg }
  ports: [{ port: 5432 }]
