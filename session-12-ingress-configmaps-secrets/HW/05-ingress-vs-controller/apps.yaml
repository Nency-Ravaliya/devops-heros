# Two small backends behind ClusterIP Services.
# traefik/whoami answers with the pod's hostname, so routing is visible.
apiVersion: v1
kind: Namespace
metadata:
  name: s12-hw
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: s12-hw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          args: ["--name", "shop"]
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shop-svc
  namespace: s12-hw
spec:
  selector:
    app: shop
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog
  namespace: s12-hw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog
  template:
    metadata:
      labels:
        app: blog
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          args: ["--name", "blog"]
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: blog-svc
  namespace: s12-hw
spec:
  selector:
    app: blog
  ports:
    - port: 80
      targetPort: 80
