apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-backend
  labels:
    app: campus-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-backend
  template:
    metadata:
      labels:
        app: campus-backend
    spec:
      containers:
        - name: api
          image: python:3.11-alpine
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: campus-app-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: campus-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campus-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: campus-db-secret
                  key: POSTGRES_DB
          command:
            - sh
            - -c
            - |
              cat > /api.py <<'PY'
              import os
              from http.server import BaseHTTPRequestHandler, HTTPServer

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = "\n".join([
                          "campus backend",
                          "host: %s" % os.uname().nodename,
                          "path: %s" % self.path,
                          "ENVIRONMENT: %s" % os.getenv("ENVIRONMENT", "unset"),
                          "LOG_LEVEL: %s" % os.getenv("LOG_LEVEL", "unset"),
                          "DEFAULT_CAMPUS: %s" % os.getenv("DEFAULT_CAMPUS", "unset"),
                          "SESSION_TIMEOUT_MINUTES: %s" % os.getenv("SESSION_TIMEOUT_MINUTES", "unset"),
                          "POSTGRES_USER: %s" % os.getenv("POSTGRES_USER", "unset"),
                          "POSTGRES_DB: %s" % os.getenv("POSTGRES_DB", "unset"),
                          "password_length: %s" % len(os.getenv("POSTGRES_PASSWORD", "")),
                      ]) + "\n"
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain")
                      self.end_headers()
                      self.wfile.write(body.encode())

                  def log_message(self, *args):
                      pass

              HTTPServer(("", int(os.getenv("APP_PORT", "5000"))), Handler).serve_forever()
              PY
              exec python /api.py
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: campus-backend-service
spec:
  type: ClusterIP
  selector:
    app: campus-backend
  ports:
    - port: 80
      targetPort: 5000
