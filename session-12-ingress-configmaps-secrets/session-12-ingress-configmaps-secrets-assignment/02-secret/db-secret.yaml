apiVersion: v1
kind: Secret
metadata:
  name: yatri-db-secret
  labels:
    app: yatri-app
type: Opaque
data:
  # base64("yatri_admin")    -> eWF0cmlfYWRtaW4=
  # base64("secretpassword") -> c2VjcmV0cGFzc3dvcmQ=
  # NOTE: encoded with `printf` / `echo -n` (no trailing newline). See Task 4.
  POSTGRES_USER: eWF0cmlfYWRtaW4=
  POSTGRES_PASSWORD: c2VjcmV0cGFzc3dvcmQ=
