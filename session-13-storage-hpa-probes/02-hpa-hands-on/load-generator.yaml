# Each replica hammers the Service in a tight loop.
# Start with 1 replica, then `kubectl scale deploy load-generator --replicas=4` to increase load.
#
# The target is $HPA_DEMO_SERVICE_SERVICE_HOST (the Service's ClusterIP, injected by
# Kubernetes as an env var) instead of the DNS name. Resolving "hpa-demo-service" on
# every request floods CoreDNS once several generators run, lookups start failing with
# "wget: bad address", and the load collapses.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O- http://$HPA_DEMO_SERVICE_SERVICE_HOST > /dev/null; done"]
