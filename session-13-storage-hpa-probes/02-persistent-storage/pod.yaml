apiVersion: v1
kind: Pod
metadata:
  name: storage-demo
spec:
  containers:
    - name: app
      image: nginx:1.27
      volumeMounts:
          - name: persistent-storage
            mountPath: /demo
          - name: persistent-storage
            mountPath: /web
  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: student-pvc
