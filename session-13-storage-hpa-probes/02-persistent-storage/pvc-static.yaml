# Static-binding variant of pvc.yaml.
# storageClassName: "" stops minikube's default StorageClass from dynamically
# provisioning a new volume, so this claim binds to the pre-created student-pv.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: student-pvc
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
