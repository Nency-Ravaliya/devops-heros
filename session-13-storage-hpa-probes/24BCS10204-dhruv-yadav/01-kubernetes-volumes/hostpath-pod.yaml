# hostPath mounts a directory from the node's filesystem into the Pod.
# Pinned to one node so we can inspect the file on that node afterwards.
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
  namespace: s13-storage
spec:
  nodeSelector:
    kubernetes.io/hostname: devops-heros-worker
  containers:
  - name: app
    image: busybox:1.36
    command: ["/bin/sh", "-c", "echo 'hello from pod hostpath-demo' > /data/hello.txt; sleep 3600"]
    volumeMounts:
    - name: host-storage
      mountPath: /data
  volumes:
  - name: host-storage
    hostPath:
      path: /tmp/24bcs10204-hostpath
      type: DirectoryOrCreate
