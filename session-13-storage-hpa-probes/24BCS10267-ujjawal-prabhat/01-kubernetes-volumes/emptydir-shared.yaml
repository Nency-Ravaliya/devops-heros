# emptyDir shared between two containers of the same Pod.
# "writer" appends a timestamp every 5s; "web" (nginx) serves the same file.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-shared
  namespace: s13-storage
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - while true; do echo "written by writer at $(date)" >> /shared/index.html; sleep 5; done
      volumeMounts:
        - name: shared-data
          mountPath: /shared
    - name: web
      image: nginx:1.27
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
  volumes:
    - name: shared-data
      emptyDir: {}
