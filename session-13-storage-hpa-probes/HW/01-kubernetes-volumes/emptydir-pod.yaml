# Two containers in one Pod sharing an emptyDir.
# "writer" appends the date every 5s, "web" (nginx) serves the same file.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  namespace: p13-vol
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /out/index.html; sleep 5; done"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
      volumeMounts:
        - name: shared
          mountPath: /out
    - name: web
      image: nginx:1.27
      resources:
        requests: { cpu: 10m, memory: 32Mi }
      volumeMounts:
        - name: shared
          mountPath: /usr/share/nginx/html
  volumes:
    - name: shared
      emptyDir: {}
