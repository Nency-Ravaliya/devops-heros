# hostPath: mounts a directory from the node itself into the Pod.
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
  namespace: p13-vol
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
      volumeMounts:
        - name: host-storage
          mountPath: /data
  volumes:
    - name: host-storage
      hostPath:
        path: /tmp/p13-hostpath-data
        type: DirectoryOrCreate
