# Load generator: busybox Pods that call the Service in a tight loop.
# 3 Pods x 4 parallel wget loops (1 Pod was not enough, see README). Scale replicas to 0 to stop the load.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              for i in 1 2 3 4; do
                (while true; do wget -q -O- http://hpa-demo-service > /dev/null; done) &
              done
              wait
          resources:
            requests: { cpu: 50m, memory: 16Mi }
            limits: { cpu: 300m, memory: 32Mi }
