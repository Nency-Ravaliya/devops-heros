apiVersion: v1
kind: Pod
metadata:
  name: readiness-broken
  labels:
    app: readiness-broken
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /does-not-exist
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5
