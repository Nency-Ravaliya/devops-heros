apiVersion: v1
kind: Pod
metadata:
  name: static-pv-consumer
  namespace: s13-storage
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["/bin/sh", "-c", "echo 'stored on a static PV' > /data/note.txt; sleep 3600"]
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: static-pvc
