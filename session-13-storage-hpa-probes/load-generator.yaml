apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  labels:
    app: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load-generator
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O- http://hpa-demo-service:80 > /dev/null; done"]
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
