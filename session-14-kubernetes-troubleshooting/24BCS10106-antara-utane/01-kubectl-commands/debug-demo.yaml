# Practice workload for Task 1.
# - Deployment "web" (2 nginx replicas) for get / describe / exec / top / -o wide
# - Pod "multi" with two containers, to practise `kubectl logs -c`
# - Pod "restarter" that exits every ~15s, to practise `kubectl logs --previous`
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: s14
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: multi
  namespace: s14
  labels:
    app: multi
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "i=0; while true; do i=$((i+1)); echo \"[app] request #$i handled\"; sleep 3; done"]
    - name: sidecar
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"[sidecar] shipping logs at $(date +%T)\"; sleep 5; done"]
---
apiVersion: v1
kind: Pod
metadata:
  name: restarter
  namespace: s14
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"boot at $(date +%T)\"; sleep 15; echo 'fatal: lost connection, exiting'; exit 2"]
