# Fix for scenarios/scenario-1-crashloop/broken.yaml
# 1. DATABASE_URL is now provided.
# 2. The process keeps running after start-up (a Pod with restartPolicy Always
#    that exits - even with code 0 - would be restarted and loop again).
apiVersion: v1
kind: Pod
metadata:
  name: fail-1-crashloop-pod
  labels:
    tier: triage-gauntlet
    scenario: crashloop
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      env:
        - name: DATABASE_URL
          value: "postgres://postgres-db.s14.svc.cluster.local:5432/app"
      command:
        - "python3"
        - "-c"
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully!", flush=True)
          print("Using DATABASE_URL=" + db_url, flush=True)
          while True:
              time.sleep(3600)
