# Stuck in ContainerCreating: the Pod mounts a ConfigMap and a Secret that do not exist yet.
apiVersion: v1
kind: Pod
metadata:
  name: config-volume-pod
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      volumeMounts:
        - name: site-config
          mountPath: /usr/share/nginx/html
        - name: tls
          mountPath: /etc/tls
          readOnly: true
  volumes:
    - name: site-config
      configMap:
        name: site-config
    - name: tls
      secret:
        secretName: site-tls
