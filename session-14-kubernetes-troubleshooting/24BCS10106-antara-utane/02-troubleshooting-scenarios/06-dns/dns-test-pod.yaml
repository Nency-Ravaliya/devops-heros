# The course's 09-service-dns-troubleshooting/dns-test-pod.yaml uses
# registry.k8s.io/e2e-test-images/dnsutils:1.3, which no longer resolves
# ("not found" -> ImagePullBackOff). busybox ships nslookup and works fine.
apiVersion: v1
kind: Pod
metadata:
  name: dns-test
spec:
  containers:
    - name: dns-test
      image: busybox:1.36
      command: ["sleep", "3600"]
