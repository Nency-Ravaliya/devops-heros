# Fix: keep default-deny, but explicitly allow role=client Pods to reach shop-api on TCP/80.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-to-shop-api
spec:
  podSelector:
    matchLabels:
      app: shop-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: client
      ports:
        - protocol: TCP
          port: 80
