# Bug 1: configMapKeyRef asks for key DB_HOST, but the ConfigMap key is db_host
#        -> CreateContainerConfigError.
# Bug 2: LOG_LEVEL is hard-coded to an invalid value the app rejects.
apiVersion: v1
kind: Pod
metadata:
  name: config-app
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          echo "DB_HOST=$DB_HOST LOG_LEVEL=$LOG_LEVEL"
          case "$LOG_LEVEL" in debug|info|warn|error) ;; *) echo "invalid LOG_LEVEL '$LOG_LEVEL'"; exit 1;; esac
          echo "config OK, app running"; sleep 3600
      env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_HOST
        - name: LOG_LEVEL
          value: verbose
