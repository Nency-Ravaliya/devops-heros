# From ../../scenarios/scenario-1-crashloop/broken.yaml.
# I added a sleep after "started" so a fixed app keeps running (the original exits 0,
# which would also restart forever under a Pod's restartPolicy: Always).
apiVersion: v1
kind: Pod
metadata:
  name: crashloop-app
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      command:
        - python3
        - -c
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully!", flush=True)
          time.sleep(3600)
      resources:
        requests: { cpu: 10m, memory: 16Mi }
