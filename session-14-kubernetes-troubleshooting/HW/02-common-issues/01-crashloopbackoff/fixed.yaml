apiVersion: v1
kind: ConfigMap
metadata:
  name: crashloop-app-config
data:
  DATABASE_URL: postgres://app@postgres:5432/appdb
---
apiVersion: v1
kind: Pod
metadata:
  name: crashloop-app
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      command:
        - python3
        - -c
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully!", flush=True)
          time.sleep(3600)
      envFrom:
        - configMapRef:
            name: crashloop-app-config
      resources:
        requests: { cpu: 10m, memory: 16Mi }
