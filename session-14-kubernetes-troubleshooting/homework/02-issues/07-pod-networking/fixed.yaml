# FIX: bind to 0.0.0.0 so traffic arriving on the Pod IP is accepted.
apiVersion: v1
kind: Pod
metadata:
  name: metrics-api
  labels:
    app: metrics-api
spec:
  containers:
    - name: app
      image: python:3.11-alpine
      command: ["python3", "-m", "http.server", "8080", "--bind", "0.0.0.0"]
      ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-api
spec:
  selector:
    app: metrics-api
  ports:
    - port: 80
      targetPort: 8080
