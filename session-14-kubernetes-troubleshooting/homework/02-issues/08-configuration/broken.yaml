# Env var references key "SMTP_SERVER", but the ConfigMap key is "SMTP_HOST".
apiVersion: v1
kind: Pod
metadata:
  name: notify-svc
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo SMTP=$SMTP_HOST:$SMTP_PORT; sleep 3600"]
      env:
        - name: SMTP_HOST
          valueFrom:
            configMapKeyRef:
              name: notify-config
              key: SMTP_SERVER
        - name: SMTP_PORT
          valueFrom:
            configMapKeyRef:
              name: notify-config
              key: SMTP_PORT
