# Healthy sample workload used to practise the read-only troubleshooting commands.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: task1
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        tier: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          env:
            - name: APP_ENV
              value: "lab"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: task1
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
