apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-generator
  namespace: task2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-generator
  template:
    metadata:
      labels:
        app: report-generator
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo report-generator started; while true; do sleep 30; done"]
          resources:
            # BUG: requests more CPU/memory than any node can offer -> scheduler can't place it
            requests:
              cpu: "16"
              memory: 8Gi
