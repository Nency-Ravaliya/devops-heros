apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-generator
  namespace: task2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-generator
  template:
    metadata:
      labels:
        app: report-generator
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo report-generator started; while true; do sleep 30; done"]
          resources:
            # FIX: right-sized requests that fit the node's allocatable capacity
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
