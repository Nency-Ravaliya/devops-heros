apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: task2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: hashicorp/http-echo:1.0
          args: ["-text=orders-api: 42 open orders", "-listen=:5678"]
          ports:
            - name: http
              containerPort: 5678
---
apiVersion: v1
kind: Pod
metadata:
  name: netshoot
  namespace: task2
spec:
  containers:
    - name: netshoot
      # agnhost ships curl, wget, nc, nslookup and dig - a handy debug image
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      command: ["sleep", "infinity"]
