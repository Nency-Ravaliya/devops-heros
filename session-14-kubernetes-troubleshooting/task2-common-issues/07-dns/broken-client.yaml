apiVersion: v1
kind: Pod
metadata:
  name: storefront
  namespace: task2
  labels:
    app: storefront
spec:
  containers:
    - name: storefront
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      env:
        # BUG: short name only resolves inside the client's own namespace (task2)
        - name: CATALOG_URL
          value: "http://catalog"
      command:
        - sh
        - -c
        - |
          while true; do
            echo "$(date -u +%H:%M:%S) GET $CATALOG_URL -> $(curl -sS --max-time 3 $CATALOG_URL 2>&1)"
            sleep 5
          done
