# The catalog API lives in the task2-backend namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: task2-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: hashicorp/http-echo:1.0
          args: ["-text=catalog-api: 120 products", "-listen=:5678"]
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: task2-backend
spec:
  selector:
    app: catalog
  ports:
    - port: 80
      targetPort: 5678
