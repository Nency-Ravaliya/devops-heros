apiVersion: v1
kind: Pod
metadata:
  name: metrics-exporter
  namespace: task2
  labels:
    app: metrics-exporter
spec:
  containers:
    - name: exporter
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          mkdir -p /www && echo "requests_total 1337" > /www/metrics
          # BUG: server binds to loopback only -> unreachable from other Pods
          httpd -f -v -p 127.0.0.1:8080 -h /www
      ports:
        - containerPort: 8080
