# storefront-web: nginx serving the shop page and reverse-proxying /api/ to products-api
apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-nginx
  namespace: shopeasy
data:
  default.conf: |
    server {
      listen 80;
      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
      location /healthz {
        return 200 "ok\n";
      }
      location /api/ {
        proxy_pass http://products-service;   # BUG 3: Service is called "products-api"
      }
    }
  index.html: |
    <h1>ShopEasy</h1><p>Products are loaded from /api/products</p>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-web
  namespace: shopeasy
  labels:
    app: storefront-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront-web
  template:
    metadata:
      labels:
        app: storefront-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: conf
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: conf
          configMap:
            name: storefront-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-web
  namespace: shopeasy
spec:
  type: NodePort
  selector:
    app: storefront-web
  ports:
    - port: 80
      targetPort: http
      nodePort: 30080
