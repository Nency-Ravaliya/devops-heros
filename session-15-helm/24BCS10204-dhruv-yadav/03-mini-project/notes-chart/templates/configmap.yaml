apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notes-chart.fullname" . }}-config
  labels:
    {{- include "notes-chart.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.app.name | quote }}
  ENVIRONMENT: {{ .Values.app.environment | quote }}
  index.html: |
    <h1>{{ .Values.app.message }}</h1>
    <p>app={{ .Values.app.name }} env={{ .Values.app.environment }} image={{ include "notes-chart.image" . }} release={{ .Release.Name }} revision={{ .Release.Revision }}</p>
