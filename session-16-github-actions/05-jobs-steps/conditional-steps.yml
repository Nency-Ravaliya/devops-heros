name: Conditional Steps Example

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-conditional-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: General build step
        run: echo "Building code on branch ${{ github.ref_name }}"

      - name: Deploy step (Only on main branch)
        if: github.ref == 'refs/heads/main'
        run: echo "Production deployment triggered for commit ${{ github.sha }}"

      - name: Notification step (Always runs)
        if: always()
        run: echo "Workflow finished with job status: ${{ job.status }}"
