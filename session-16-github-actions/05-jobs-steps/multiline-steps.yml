name: Multiline Steps Example

on: push

jobs:
  multiline-execution:
    runs-on: ubuntu-latest
    env:
      GLOBAL_ENV: "demo-environment"
    steps:
      - name: Execute script with multiline commands and environment variables
        env:
          STEP_PARAM: "step-specific-value"
        run: |
          echo "[INFO] Running multiline step"
          echo "[INFO] Environment parameter: $GLOBAL_ENV"
          echo "[INFO] Step parameter: $STEP_PARAM"
          CURRENT_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "[INFO] Current timestamp: $CURRENT_DATE"
          echo "[PASS] Multiline block executed successfully"
