name: Deploy With Secrets Example

on:
  push:
    branches:
      - main

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Docker Hub using encrypted secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "[INFO] Verifying secret masking behavior..."
          # Passwords printed in workflow logs are automatically replaced by ***
          echo "Username set: ${DOCKER_USERNAME:-mock_user}"
          echo "Authenticating securely via stdin..."
          # In real execution: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
