name: Upload and Download Artifacts Example

on: push

jobs:
  build-artifact:
    name: Build Stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate build output directory
        run: |
          mkdir -p dist
          echo "Package built at $(date -u)" > dist/application.txt
          echo "v1.0.0-${{ github.sha }}" > dist/version.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-package
          path: dist/
          retention-days: 7

  consume-artifact:
    name: Verification Stage
    needs: build-artifact
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact from previous stage
        uses: actions/download-artifact@v4
        with:
          name: build-package
          path: downloaded-dist/

      - name: Inspect and verify downloaded artifact
        run: |
          echo "[INFO] Inspecting downloaded artifact content:"
          cat downloaded-dist/application.txt
          cat downloaded-dist/version.txt
          echo "[PASS] Artifact verification successful"
