# Session 16 - Continuous Integration
# Every push / PR that touches the demo project is linted, tested,
# security-checked and built into a Docker image. The image is uploaded
# as an artifact so the CD pipeline can deploy the exact same build.
name: Session 16 - CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - "session-16-github-actions/cicd-demo-project/**"
      - "!session-16-github-actions/cicd-demo-project/**/*.md"
      - "!session-16-github-actions/cicd-demo-project/screenshots/**"
      - ".github/workflows/session16-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "session-16-github-actions/cicd-demo-project/**"
      - "!session-16-github-actions/cicd-demo-project/**/*.md"
      - "!session-16-github-actions/cicd-demo-project/screenshots/**"
      - ".github/workflows/session16-ci.yml"
  workflow_dispatch:

env:
  APP_DIR: session-16-github-actions/cicd-demo-project
  IMAGE_NAME: session16-calculator-api

# Every `run:` step executes inside the demo project folder.
defaults:
  run:
    working-directory: session-16-github-actions/cicd-demo-project

permissions:
  contents: read

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          mkdir -p reports
          pytest -v \
            --junitxml=reports/junit-${{ matrix.python-version }}.xml \
            --cov=app --cov-report=term-missing \
            --cov-report=xml:reports/coverage-${{ matrix.python-version }}.xml

      - name: Upload test reports
        if: always() # keep the report even when tests fail
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: ${{ env.APP_DIR }}/reports/
          retention-days: 7

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Check for committed sensitive files
        run: |
          echo "Scanning for .env / *.pem / *.key files..."
          found=$(find . -type f \( -name ".env" -o -name "*.pem" -o -name "*.key" \))
          if [ -n "$found" ]; then
            echo "Sensitive files found:"; echo "$found"; exit 1
          fi
          echo "No sensitive files found."

      - name: Check for hard-coded secrets
        run: |
          if grep -rInE "(password|secret|token)[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]" app/; then
            echo "Possible hard-coded secret found."; exit 1
          fi
          echo "No hard-coded secrets found in app/."

  build:
    name: Build Docker Image
    needs: [lint, test, security-check] # runs only if all CI checks pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION=1.0.${{ github.run_number }} \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t $IMAGE_NAME:${{ github.sha }} .
          docker image ls $IMAGE_NAME

      - name: Run container and smoke test
        run: |
          docker run -d --name app -p 5000:5000 $IMAGE_NAME:${{ github.sha }}
          ./scripts/smoke_test.sh http://localhost:5000
          docker rm -f app

      - name: Save image and build info
        run: |
          mkdir -p build
          docker save $IMAGE_NAME:${{ github.sha }} | gzip > build/image.tar.gz
          cat > build/build-info.txt <<EOF
          image: $IMAGE_NAME:${{ github.sha }}
          version: 1.0.${{ github.run_number }}
          commit: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          built at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF
          cat build/build-info.txt
          ls -lh build

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: ${{ env.APP_DIR }}/build/
          retention-days: 7
