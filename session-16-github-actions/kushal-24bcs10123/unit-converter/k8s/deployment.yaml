apiVersion: apps/v1
kind: Deployment
metadata:
  name: unit-converter
  labels: { app: unit-converter }
spec:
  replicas: 2
  selector:
    matchLabels: { app: unit-converter }
  template:
    metadata:
      labels: { app: unit-converter }
    spec:
      containers:
        - name: unit-converter
          image: ghcr.io/kushaltalati/unit-converter:latest
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
