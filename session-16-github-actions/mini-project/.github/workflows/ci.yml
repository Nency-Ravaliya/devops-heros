name: Continuous Integration (CI) Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Code Linting & Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Code Inspection
        run: |
          echo "Running flake8 static code analysis..."
          flake8 app/ tests/ --count --max-line-length=120 --statistics

  test:
    name: Unit Testing & Code Coverage
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install App Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite with Coverage
        run: |
          mkdir -p test-results
          pytest tests/ \
            -v \
            --junitxml=test-results/results.xml \
            --cov=app \
            --cov-report=xml:test-results/coverage.xml \
            --cov-report=term-missing

      - name: Upload Test Results XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/
          retention-days: 7

  security-scan:
    name: DevSecOps Secret & Vulnerability Scan
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Inspect Workspace for Sensitive Files & Keys
        run: |
          echo "Scanning repository for committed credentials, keys, and environment files..."
          if find . -type f \( -name "*.pem" -o -name "*.key" -o -name ".env" -o -name "id_rsa*" \) | grep -q .; then
            echo "CRITICAL: Sensitive credential file detected in repository workspace!"
            find . -type f \( -name "*.pem" -o -name "*.key" -o -name ".env" -o -name "id_rsa*" \)
            exit 1
          else
            echo "PASSED: Zero exposed secrets or raw private keys detected."
          fi

  build:
    name: Package Application Artifacts
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Packaging Script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify Build Output
        run: |
          cat build/build-info.txt

      - name: Upload Packaged Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-application-build
          path: build/
          retention-days: 14
