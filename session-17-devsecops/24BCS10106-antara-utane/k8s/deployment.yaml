apiVersion: apps/v1
kind: Deployment
metadata:
  name: s17-devsecops-demo
  labels:
    app: s17-devsecops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: s17-devsecops-demo
  template:
    metadata:
      labels:
        app: s17-devsecops-demo
    spec:
      automountServiceAccountToken: false # app never talks to the k8s API
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: __IMAGE__ # replaced by the pipeline with ghcr.io/Aana-1025
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "__VERSION__"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            # gunicorn needs a writable tmp dir; everything else is read-only
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
