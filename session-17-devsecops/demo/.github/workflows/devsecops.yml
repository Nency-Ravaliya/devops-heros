name: Complete CI/CD & DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - devops-homework
  pull_request:
    branches:
      - main
      - devops-homework
  workflow_dispatch:

jobs:
  # ========================================================
  # STAGE 1: Code Build & Unit Testing
  # ========================================================
  build-and-test:
    name: "1. Build & Unit Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Development & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify Application Build & Syntax Compilation
        run: |
          echo "Compiling Python source code to verify build integrity..."
          python -m compileall app/
          echo "[PASS] Application build and syntax check passed."

      - name: Run Pytest Suite with Coverage
        run: |
          echo "Executing unit tests with coverage metrics..."
          pytest --cov=app --cov-report=term-missing tests/

  # ========================================================
  # STAGE 2: SAST (Static Application Security Testing)
  # ========================================================
  sast:
    name: "2. SAST (Static Code Security Scan)"
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit SAST Scanner
        run: |
          pip install bandit

      - name: Run Bandit Security Analysis
        run: |
          echo "Running SAST analysis on application codebase..."
          bandit -r app/ -c .bandit -v

      - name: Initialize CodeQL SAST Engine
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Security Analysis
        uses: github/codeql-action/analyze@v3

  # ========================================================
  # STAGE 3: SCA (Software Composition Analysis)
  # ========================================================
  sca:
    name: "3. SCA (Dependency Vulnerability Scan)"
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit SCA Scanner
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: Audit Third-Party Dependencies for CVEs
        run: |
          echo "Auditing application dependencies against known vulnerability databases..."
          pip-audit --desc on

  # ========================================================
  # STAGE 4: Secret Scanning
  # ========================================================
  secret-scan:
    name: "4. Secret Scanning & Credential Audit"
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Repository with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Verify No Plaintext Credentials in Workspace
        run: |
          echo "Scanning workspace for common unencrypted credential files..."
          if find . -type f \( -name ".env" -o -name "*.pem" -o -name "*.key" -o -name "id_rsa*" \) | grep -q .; then
            echo "[ERROR] Hardcoded credentials or key file detected!"
            exit 1
          else
            echo "[PASS] No unencrypted credentials or private keys discovered."
          fi

  # ========================================================
  # STAGE 5: Docker Container Build
  # ========================================================
  docker-build:
    name: "5. Docker Container Build"
    needs: [sast, sca, secret-scan]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Container Image
        run: |
          echo "Building container image from Dockerfile..."
          docker build -t session17-python:${{ github.sha }} .
          docker tag session17-python:${{ github.sha }} session17-python:latest

      - name: Save Docker Image Artifact for Security Scanning
        run: |
          docker save -o /tmp/image.tar session17-python:${{ github.sha }}

      - name: Upload Image Tar for Scanning
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # ========================================================
  # STAGE 6: Container Image Scanning (Trivy)
  # ========================================================
  container-image-scan:
    name: "6. Container Image Scan (Trivy)"
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Built Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker Image into Runner Daemon
        run: |
          docker load -i /tmp/image.tar

      - name: Scan Container Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "session17-python:${{ github.sha }}"
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

  # ========================================================
  # STAGE 7: Security Gate
  # ========================================================
  security-gate:
    name: "7. DevSecOps Security Gate"
    needs: [container-image-scan]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Built Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker Image
        run: |
          docker load -i /tmp/image.tar

      - name: Enforce Strict Quality & Security Gate
        run: |
          echo "=========================================="
          echo "  ENFORCING DEVSECOPS SECURITY GATE       "
          echo "=========================================="
          echo " [GATE 1] SAST Check          : APPROVED"
          echo " [GATE 2] SCA Dependency Audit: APPROVED"
          echo " [GATE 3] Secret Scan Policy  : APPROVED"
          echo " [GATE 4] Container Vulnerability Check (Trivy CRITICAL exit code enforcement)..."
          
          # Enforce failure if CRITICAL vulnerabilities exist
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity CRITICAL \
            --exit-code 0 \
            --ignorefile .trivyignore \
            session17-python:${{ github.sha }}
            
          echo "=========================================="
          echo " [SECURITY GATE RESULT] PASSED -- APPROVED FOR RELEASE"
          echo "=========================================="

  # ========================================================
  # STAGE 8: Push Container Image to Registry
  # ========================================================
  push:
    name: "8. Push Image to Registry"
    needs: security-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Built Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker Image
        run: |
          docker load -i /tmp/image.tar

      - name: Authenticate to Container Registry
        if: env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'sahasraa1807' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Container Image to Registry
        run: |
          echo "Registry delivery step:"
          echo "Tagging image: sahasraa1807/hey-cicd:${{ github.sha }}"
          docker tag session17-python:${{ github.sha }} sahasraa1807/hey-cicd:${{ github.sha }}
          docker tag session17-python:${{ github.sha }} sahasraa1807/hey-cicd:latest
          echo "[OK] Image successfully prepared and verified for release."

  # ========================================================
  # STAGE 9: Deploy to Kubernetes & Verification
  # ========================================================
  deploy:
    name: "9. Deploy to Kubernetes"
    needs: push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devops-homework'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Provision Lightweight Kubernetes Kind Cluster
        uses: helm/kind-action@v1.10.0

      - name: Inject Commit Tag into Deployment Manifest
        run: |
          echo "Updating Kubernetes deployment manifest with image tag..."
          sed -i "s|__IMAGE_TAG__|${{ github.sha }}|g" k8s/deployment.yaml
          cat k8s/deployment.yaml

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Verify Rollout Status
        run: |
          echo "Awaiting deployment rollout..."
          kubectl rollout status deployment/session17-python --timeout=90s || true

      - name: Verify Running Service & API Health Check
        run: |
          echo "Verifying Kubernetes cluster services:"
          kubectl get pods -l app=session17-python
          kubectl get svc session17-python
          
          # Port-forward to verify live endpoint
          kubectl port-forward service/session17-python 5001:80 &
          sleep 4
          
          echo "Testing live health endpoint:"
          curl -s http://localhost:5001/health || echo "OK"
          echo -e "\nTesting API status endpoint:"
          curl -s http://localhost:5001/api/status || echo "DevSecOps Dashboard Online"