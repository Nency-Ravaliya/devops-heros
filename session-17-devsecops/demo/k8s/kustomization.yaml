apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
# The pipeline pins the image to the exact commit it scanned:
#   kustomize edit set image ghcr.io/jenyyy4/session17-devsecops=ghcr.io/jenyyy4/session17-devsecops:<sha>
images:
  - name: ghcr.io/jenyyy4/session17-devsecops
    newTag: latest
