apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-canary-stable
  labels:
    app: app-canary
    track: stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: app-canary
      track: stable
  template:
    metadata:
      labels:
        app: app-canary
        track: stable
    spec:
      containers:
        - name: web
          image: nginx:1.24-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
