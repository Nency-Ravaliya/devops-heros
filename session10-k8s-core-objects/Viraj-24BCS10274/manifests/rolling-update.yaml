apiVersion: apps/v1
kind: Deployment
metadata:
  name: rolling-web
  labels:
    app: rolling-web
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: rolling-web
  template:
    metadata:
      labels:
        app: rolling-web
        version: v1
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: rolling-web
spec:
  selector:
    app: rolling-web
  ports:
    - port: 80
      targetPort: 80
