apiVersion: v1
kind: Pod
metadata:
  name: standalone-web
  namespace: rudray-devops-hw
  labels: {app: standalone-web}
spec:
  containers:
    - name: nginx
      image: nginx:1.28-alpine
      ports: [{containerPort: 80}]
      resources:
        requests: {cpu: 25m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: replica-web
  namespace: rudray-devops-hw
spec:
  replicas: 2
  selector:
    matchLabels: {app: replica-web}
  template:
    metadata:
      labels: {app: replica-web}
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-web
  namespace: rudray-devops-hw
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: deployment-web}
  template:
    metadata:
      labels: {app: deployment-web}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 3
