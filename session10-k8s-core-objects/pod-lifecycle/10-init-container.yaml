apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-init
spec:
  initContainers:
    - name: setup
      image: busybox:latest
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "echo 'Init container running'; sleep 5; echo 'Init complete'"]
  containers:
    - name: app
      image: nginx:1.25
      imagePullPolicy: IfNotPresent
