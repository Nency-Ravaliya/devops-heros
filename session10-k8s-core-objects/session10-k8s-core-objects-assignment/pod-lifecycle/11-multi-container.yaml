# Two containers in one pod (app + logging sidecar) => READY 2/2.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-multi-container
  labels:
    demo: lifecycle
spec:
  containers:
    - name: app
      image: nginx:alpine
      ports:
        - containerPort: 80
    - name: sidecar
      image: busybox
      command: ["sh", "-c", "while true; do echo sidecar log $(date); sleep 5; done"]
