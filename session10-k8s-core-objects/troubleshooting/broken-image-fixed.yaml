# ==============================================================================
# FIX for broken-image.yaml
# Root cause: the image tag 'yatri-backend:non-existent-tag-v999' does not exist,
# so new surge pods sit in ImagePullBackOff and the rollout never completes.
# Fix: point at an image tag that actually exists.
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  labels:
    app: yatri-backend
    version: "fixed-v3"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
        version: "fixed-v3"
    spec:
      containers:
        - name: backend
          image: nginx:alpine
          ports:
            - containerPort: 5000
