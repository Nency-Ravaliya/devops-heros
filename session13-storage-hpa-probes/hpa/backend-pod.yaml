apiVersion: v1
kind: Pod
metadata:
  name: yatri-backend-pod
  labels:
    app: yatri-backend
spec:
  containers:
  - name: backend
    image: python:3.9-slim
    command: ["python", "-m", "http.server", "5000"]
    ports:
    - containerPort: 5000
      protocol: TCP
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "500m"
    livenessProbe:
      httpGet:
        path: /
        port: 5000
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /
        port: 5000
      initialDelaySeconds: 5
      periodSeconds: 5
