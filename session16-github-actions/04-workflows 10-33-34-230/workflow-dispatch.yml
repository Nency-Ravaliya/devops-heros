name: Manual Trigger Example

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - uat
          - production
      run_smoke_tests:
        description: 'Execute smoke tests post deployment'
        required: false
        type: boolean
        default: true

jobs:
  manual-execution:
    runs-on: ubuntu-latest
    steps:
      - name: Report input parameters
        run: |
          echo "Selected environment: ${{ inputs.environment }}"
          echo "Run smoke tests: ${{ inputs.run_smoke_tests }}"
