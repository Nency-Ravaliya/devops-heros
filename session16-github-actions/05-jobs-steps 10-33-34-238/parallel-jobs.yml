name: Parallel Jobs Example

on: push

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Unit test execution
        run: echo "Running unit tests in parallel..."

  lint:
    name: Code Quality Linter
    runs-on: ubuntu-latest
    steps:
      - name: Flake8 lint execution
        run: echo "Running linter in parallel..."

  security-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Security scanner execution
        run: echo "Running static security scan in parallel..."
