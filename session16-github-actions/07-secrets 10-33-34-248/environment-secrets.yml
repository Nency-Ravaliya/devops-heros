name: Environment Secrets Example

on:
  push:
    branches:
      - main

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.prod.example.com
    steps:
      - name: Deploy to production environment
        env:
          PROD_API_KEY: ${{ secrets.PROD_API_KEY }}
        run: |
          echo "[INFO] Running deployment targeting protected environment: production"
          echo "[INFO] Using environment-scoped secrets (masked in logs)"
