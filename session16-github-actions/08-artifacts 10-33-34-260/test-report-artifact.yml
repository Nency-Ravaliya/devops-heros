name: Test Report Artifact Example

on: push

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate mock test results
        run: |
          mkdir -p test-results
          cat << 'EOF' > test-results/results.xml
          <?xml version="1.0" encoding="utf-8"?>
          <testsuites>
            <testsuite name="pytest" errors="0" failures="0" skipped="0" tests="3" time="0.15">
              <testcase classname="tests.test_app" name="test_index" time="0.05" />
              <testcase classname="tests.test_app" name="test_get_notes" time="0.04" />
              <testcase classname="tests.test_app" name="test_health" time="0.03" />
            </testsuite>
          </testsuites>
          EOF

      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 14
