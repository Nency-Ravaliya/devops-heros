name: CD Pipeline

# CD = Continuous Delivery/Deployment: after CI succeeds on main,
# publish the Docker image and deploy it.
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write                   # needed to push to GHCR
  actions: read                     # needed to download artifacts of the CI run

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/calculator-api

jobs:
  publish-image:
    name: Publish Docker Image
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: vars
        run: echo "tag=$(echo ${{ github.event.workflow_run.head_sha || github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}     # secret provided automatically
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to Staging
    needs: publish-image
    runs-on: ubuntu-latest
    environment: staging            # environment-scoped secrets and optional approvals
    steps:
      - name: Download build artifact from the CI run
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: calculator-build
          path: build/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Show build info
        if: ${{ github.event_name == 'workflow_run' }}
        run: cat build/build-info.txt
      - name: Deploy (simulated)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}   # add under Settings > Secrets
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.publish-image.outputs.tag }}
        run: |
          echo "Deploying $IMAGE to staging"
          if [ -z "$DEPLOY_TOKEN" ]; then echo "DEPLOY_TOKEN not set, skipping real deploy"; else echo "Using deploy token (masked in logs)"; fi
          echo "Deployment complete"
