global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # This intentionally unreachable target gives the lab a real alert to inspect.
  - job_name: demo-unreachable
    static_configs:
      - targets:
          - unreachable-demo:9999
