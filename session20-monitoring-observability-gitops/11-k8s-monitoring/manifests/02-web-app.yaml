# nginx web app with resource requests/limits and two independent health checks:
#   livenessProbe  -> GET /healthz  (fails => kubelet RESTARTS the container)
#   readinessProbe -> GET /ready    (fails => pod removed from Service endpoints, no restart)
# Both files are created by the container's start command, so deleting one of them
# with `kubectl exec` lets us break a probe on purpose and watch Kubernetes react.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: monitoring-demo
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo ok > /usr/share/nginx/html/healthz
              echo ready > /usr/share/nginx/html/ready
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3      # generous: the demo node is small and busy
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: monitoring-demo
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
