# A deliberately "noisy" workload: a busy loop that burns CPU up to its limit.
# Used to show the difference in `kubectl top pods` and to trigger the
# threshold-based alert script in ../scripts/check-alerts.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-burner
  namespace: monitoring-demo
  labels:
    app: cpu-burner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-burner
  template:
    metadata:
      labels:
        app: cpu-burner
    spec:
      containers:
        - name: burner
          image: busybox:1.36
          command: ["/bin/sh", "-c", "echo 'burning CPU...'; while true; do :; done"]
          resources:
            requests:
              cpu: 50m
              memory: 8Mi
            limits:
              cpu: 250m
              memory: 16Mi
