# Short-lived client that hammers the web Service so the HPA has something to react to.
# Delete it after the demo:  kubectl --context session20 -n monitoring-demo delete pod load-generator
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: monitoring-demo
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: busybox:1.36
      command: ["/bin/sh", "-c", "while true; do wget -q -O- http://web >/dev/null; done"]
      resources:
        limits:
          cpu: 200m
          memory: 16Mi
