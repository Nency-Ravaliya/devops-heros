# Applied ONCE by hand (kubectl apply -f). Kept OUTSIDE the watched app/ path on purpose:
# this object tells Argo CD what to watch; it is not one of the workload manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: s20-gitops-24BCS10204
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/DhruvPrabhat/devops-heros.git
    targetRevision: 24BCS10204/session-20
    path: session20-monitoring-observability-gitops/24BCS10204-Dhruv-prabhat/gitops/app

  destination:
    server: https://kubernetes.default.svc
    namespace: s20-gitops

  syncPolicy:
    automated:
      prune: true      # delete cluster objects whose manifest was removed from Git
      selfHeal: true   # revert manual (kubectl) drift back to what Git says
    syncOptions:
      - CreateNamespace=true
