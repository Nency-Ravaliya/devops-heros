apiVersion: apps/v1
kind: Deployment
metadata:
  name: chhavi-gitops-app
  labels:
    app: chhavi-gitops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chhavi-gitops-app
  template:
    metadata:
      labels:
        app: chhavi-gitops-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
