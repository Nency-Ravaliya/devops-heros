# Applied once by hand (kubectl apply -f gitops/argocd-application.yaml). It is deliberately NOT inside gitops/app/,
# because gitops/app/ is the folder Argo CD renders as workload manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: session20-mini
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kushaltalati/devops-heros.git
    targetRevision: gitops-kushal-s20
    path: session20-monitoring-observability-gitops/kushal-24bcs10123/gitops/app
  destination:
    server: https://kubernetes.default.svc
    namespace: s20-gitops
  syncPolicy:
    automated:
      prune: true        # delete cluster objects whose file was removed from Git
      selfHeal: true     # undo manual kubectl changes that drift from Git
    syncOptions:
      - CreateNamespace=true
