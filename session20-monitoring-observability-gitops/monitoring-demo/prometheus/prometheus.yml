global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "observable-app"
    metrics_path: "/metrics"
    scrape_interval: 3s
    static_configs:
      - targets: ["app:5000"]
        labels:
          environment: "production"
          service: "observability-demo"
