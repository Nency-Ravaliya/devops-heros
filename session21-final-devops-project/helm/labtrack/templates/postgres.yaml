apiVersion: v1
kind: Secret
metadata: {name: labtrack-postgres}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Service
metadata: {name: labtrack-postgres}
spec:
  selector: {app: labtrack-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: labtrack-postgres}
spec:
  replicas: 1
  selector: {matchLabels: {app: labtrack-postgres}}
  template:
    metadata: {labels: {app: labtrack-postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports: [{containerPort: 5432}]
        env:
        - {name: POSTGRES_DB, value: "{{ .Values.postgres.database }}"}
        - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: labtrack-postgres, key: username}}}
        - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: labtrack-postgres, key: password}}}
        readinessProbe: {exec: {command: ["sh","-c","pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}, initialDelaySeconds: 5, periodSeconds: 10}
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes:
      - name: data
        {{- if .Values.postgres.persistence.enabled }}
        persistentVolumeClaim: {claimName: labtrack-postgres-data}
        {{- else }}
        emptyDir: {}
        {{- end }}
{{- if .Values.postgres.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: labtrack-postgres-data}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.postgres.persistence.size }}}}
{{- end }}
