apiVersion: apps/v1
kind: Deployment
metadata: {name: labtrack-broken-image, namespace: labtrack}
spec:
  replicas: 1
  selector: {matchLabels: {app: broken-image}}
  template:
    metadata: {labels: {app: broken-image}}
    spec:
      containers: [{name: backend, image: "ghcr.io/example/labtrack-backend:does-not-exist"}]
