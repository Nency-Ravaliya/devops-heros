name: LiftLog Python CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  REGISTRY: ghcr.io
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Run backend tests
        run: pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build frontend
        run: npm install && npm run build
        working-directory: frontend
  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image prefix
        # GHCR image names must be lowercase; the owner (e.g. NeuralSynth) may not be
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images
        run: |
          docker build -t $IMAGE_PREFIX/liftlog-backend:${{ github.sha }} -t $IMAGE_PREFIX/liftlog-backend:latest ./backend
          docker build -t $IMAGE_PREFIX/liftlog-frontend:${{ github.sha }} -t $IMAGE_PREFIX/liftlog-frontend:latest ./frontend
      - name: Scan backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/liftlog-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/liftlog-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Push images
        run: |
          docker push --all-tags $IMAGE_PREFIX/liftlog-backend
          docker push --all-tags $IMAGE_PREFIX/liftlog-frontend
  update-gitops:
    # GitOps deploy: record the new image SHA in Git; Argo CD on EKS pulls the change and rolls it out.
    # No cloud credentials are needed in CI. Pushes made with GITHUB_TOKEN don't trigger new workflow runs.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: Point values-eks.yaml at the images built from this commit
        run: |
          sed -i -E "s/^(  tag: ).*/\1${GITHUB_SHA}/" helm/liftlog/values-eks.yaml
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: liftlog images ${GITHUB_SHA::7}" || { echo "Already up to date"; exit 0; }
          git pull --rebase origin main
          git push origin HEAD:main
