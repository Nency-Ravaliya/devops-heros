apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stockpilot-api
  namespace: final-k8s
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: stockpilot-api}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
