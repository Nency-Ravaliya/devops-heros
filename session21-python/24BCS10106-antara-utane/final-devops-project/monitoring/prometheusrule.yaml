# Rendered from helm/stockpilot (values-dev.yaml, namespace final) - the chart is the source of truth.
---
# Source: stockpilot/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stockpilot-alerts
  labels:
    helm.sh/chart: stockpilot-0.1.0
    app.kubernetes.io/name: stockpilot
    app.kubernetes.io/instance: stockpilot
    app.kubernetes.io/version: "1.0.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: stockpilot
    release: kps
spec:
  groups:
    - name: stockpilot.rules
      rules:
        - record: stockpilot:http_requests:rate5m
          expr: sum by (namespace, route, status) (rate(stockpilot_http_requests_total{namespace="final"}[5m]))
        - alert: StockPilotApiDown
          expr: absent(up{namespace="final", job=~".*stockpilot.*"} == 1)
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: "StockPilot API has no healthy scrape targets in final"
            description: "Prometheus could not scrape any StockPilot API pod for 2 minutes."
        - alert: StockPilotHighErrorRate
          expr: |
            sum(rate(stockpilot_http_requests_total{namespace="final", status=~"5.."}[5m]))
              / clamp_min(sum(rate(stockpilot_http_requests_total{namespace="final"}[5m])), 1e-9) > 0.05
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "StockPilot 5xx error ratio above 5%"
            description: "Error ratio is {{ $value | humanizePercentage }}."
        - alert: StockPilotHighLatencyP95
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(stockpilot_http_request_duration_seconds_bucket{namespace="final"}[5m]))) > 0.5
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "StockPilot p95 latency above 500ms"
        - alert: StockPilotLowStockItems
          expr: max(stockpilot_low_stock_items{namespace="final"}) > 0
          for: 1m
          labels: {severity: info}
          annotations:
            summary: "Some SKUs are at or below their reorder level"
            description: "{{ $value }} SKU(s) need reordering."
        - alert: StockPilotPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="final", container="api"}[15m]) > 3
          labels: {severity: warning}
          annotations:
            summary: "StockPilot API container restarting frequently"


