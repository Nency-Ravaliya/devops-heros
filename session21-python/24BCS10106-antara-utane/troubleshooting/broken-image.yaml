apiVersion: apps/v1
kind: Deployment
metadata: {name: taskboard-broken-image, namespace: taskboard}
spec:
  replicas: 1
  selector: {matchLabels: {app: broken-image}}
  template:
    metadata: {labels: {app: broken-image}}
    spec:
      containers: [{name: backend, image: ghcr.io/Aana-1025/taskboard-backend:does-not-exist}]
