apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stockpilot.fullname" . }}-config
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
data:
  APP_VERSION: {{ include "stockpilot.tag" . | quote }}
  DB_HOST: {{ printf "%s-postgres" (include "stockpilot.fullname" .) | quote }}
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
