{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "stockpilot.fullname" . }}-api
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "stockpilot.selectorLabels" . | nindent 6 }}
{{- end }}
