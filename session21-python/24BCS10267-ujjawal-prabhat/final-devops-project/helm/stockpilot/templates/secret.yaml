{{- if not .Values.database.existingSecret }}
# Rendered from values for dev/demo only. Real environments set
# database.existingSecret and manage the Secret outside Git.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stockpilot.secretName" . }}
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.database.username | quote }}
  DB_PASSWORD: {{ required "database.password is required" .Values.database.password | quote }}
{{- end }}
