{{- if .Values.monitoring.serviceMonitor.enabled }}
# kube-prometheus-stack here selects ServiceMonitors in every namespace
# (serviceMonitorSelectorNilUsesHelmValues: false), so no release label is needed.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "stockpilot.fullname" . }}-backend
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "stockpilot.selectorLabels" (list . "backend") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
