# EXAMPLE ONLY - placeholder credentials for a throwaway local cluster.
# In a real environment create the Secret out-of-band, e.g.
#   kubectl -n final-k8s create secret generic stockpilot-db \
#     --from-literal=DB_USER=stockpilot --from-literal=DB_PASSWORD="$(openssl rand -base64 24)"
# or use Sealed Secrets / External Secrets Operator (AWS Secrets Manager).
apiVersion: v1
kind: Secret
metadata:
  name: stockpilot-db
  namespace: final-k8s
  labels: {app: stockpilot-api}
type: Opaque
stringData:
  DB_USER: stockpilot
  DB_PASSWORD: change-me-placeholder
