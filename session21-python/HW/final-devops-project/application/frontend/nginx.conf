# Rendered by the nginx image entrypoint (envsubst) from /etc/nginx/templates/default.conf.template.
# BACKEND_URL = where /api is proxied when the frontend is used without an Ingress
# (docker compose: http://backend:8000, Kubernetes: http://taskboard-backend:8000).
# In Kubernetes the Ingress already sends /api straight to the backend Service.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;

  location / {
    try_files $uri /index.html;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass ${BACKEND_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
