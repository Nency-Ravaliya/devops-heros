# Values used by the Argo CD Application (environment = gitops).
# The DB Secret is NOT generated by Helm here: Argo CD renders with `helm template`,
# where `lookup` returns nothing, so a random password would change on every sync.
# The Secret "taskboard-db-gitops" is created once out-of-band (in a real setup:
# Sealed Secrets / External Secrets Operator).
app:
  env: gitops
imagePullSecrets:
  - name: ghcr-pull
postgres:
  existingSecret: taskboard-db-gitops
backend:
  replicas: 1
# The GitOps demo cluster has no ingress controller and no metrics-server.
# Argo CD reports an Ingress without a load-balancer address as "Progressing" and an HPA
# without metrics as "Degraded", so both are switched off for this environment.
ingress:
  enabled: false
hpa:
  enabled: false
