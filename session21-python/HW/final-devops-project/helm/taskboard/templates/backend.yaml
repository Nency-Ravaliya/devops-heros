apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskboard.name" . }}-backend
  labels: {{- include "taskboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels: {{- include "taskboard.selector" (list . "backend") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "taskboard.selector" (list . "backend") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.monitoring.podAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.backend.port | quote }}
        prometheus.io/path: /metrics
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: {{ include "taskboard.name" . }}-config
            - secretRef:
                name: {{ include "taskboard.secretName" . }}
          env:
            - name: APP_VERSION
              value: {{ .Values.backend.image.tag | quote }}
          startupProbe:
            httpGet: {path: {{ .Values.backend.livenessPath }}, port: http}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: {path: {{ .Values.backend.readinessPath }}, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: {{ .Values.backend.livenessPath }}, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.name" . }}-backend
  labels: {{- include "taskboard.labels" . | nindent 4 }}
    app.kubernetes.io/name: backend
spec:
  selector: {{- include "taskboard.selector" (list . "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
