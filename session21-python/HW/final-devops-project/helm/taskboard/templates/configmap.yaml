apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskboard.name" . }}-config
  labels: {{- include "taskboard.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.app.env | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  DB_HOST: {{ include "taskboard.name" . }}-postgres
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgres.database | quote }}
