# PostgreSQL as a StatefulSet: the data directory lives on a PVC created from
# volumeClaimTemplates, so tasks survive pod restarts / rescheduling.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.name" . }}-postgres
  labels: {{- include "taskboard.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "taskboard.selector" (list . "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "taskboard.name" . }}-postgres
  labels: {{- include "taskboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ include "taskboard.name" . }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "taskboard.selector" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "taskboard.selector" (list . "postgres") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ include "taskboard.secretName" . }}, key: DB_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "taskboard.secretName" . }}, key: DB_PASSWORD}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            initialDelaySeconds: 20
            periodSeconds: 15
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
