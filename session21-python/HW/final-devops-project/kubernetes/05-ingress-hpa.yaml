apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskboard
  labels: {app.kubernetes.io/part-of: taskboard}
spec:
  ingressClassName: nginx
  rules:
    - host: taskboard.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: taskboard-backend, port: {name: http}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: taskboard-frontend, port: {name: http}}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: taskboard-backend
  labels: {app.kubernetes.io/part-of: taskboard}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: taskboard-backend}
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
