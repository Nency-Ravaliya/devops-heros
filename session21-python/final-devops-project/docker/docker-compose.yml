# TaskBoard — local stack (Postgres + FastAPI backend + React/nginx frontend)
#   cd docker && docker compose up -d --build
#   UI:  http://localhost:3000     API: http://localhost:8000     (docs: /docs, metrics: /metrics)
name: taskboard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: taskboard
      # Local-dev only credential; override with POSTGRES_PASSWORD in your shell / .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskboard}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: taskboard-backend:${TAG:-1.0.0}
    build:
      context: ../application/backend
      args:
        GIT_SHA: ${GIT_SHA:-local}
    environment:
      DATABASE_URL: postgresql+psycopg://taskboard:${POSTGRES_PASSWORD:-taskboard}@postgres:5432/taskboard
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: taskboard-frontend:${TAG:-1.0.0}
    build:
      context: ../application/frontend
      args:
        GIT_SHA: ${GIT_SHA:-local}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
