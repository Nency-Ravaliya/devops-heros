{{- if not .Values.postgres.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskboard.secretName" . }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
type: Opaque
data:
  DB_USER: {{ .Values.postgres.auth.username | b64enc | quote }}
  DB_PASSWORD: {{ required "postgres.auth.password (or postgres.auth.existingSecret) is required" .Values.postgres.auth.password | b64enc | quote }}
{{- end }}
