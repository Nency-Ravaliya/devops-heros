apiVersion: v1
kind: Pod
metadata:
  name: {{ include "taskboard.fullname" . }}-test-connection
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: api
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - wget -qO- http://{{ .Values.backend.service.name }}:{{ .Values.backend.service.port }}/ready &&
          wget -qO- http://{{ include "taskboard.fullname" . }}-frontend:{{ .Values.frontend.service.port }}/healthz
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 32Mi}
