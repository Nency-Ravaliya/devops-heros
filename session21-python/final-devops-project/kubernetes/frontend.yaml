apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: taskboard
  labels: {app: frontend, app.kubernetes.io/part-of: taskboard}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend, app.kubernetes.io/part-of: taskboard}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101            # nginx-unprivileged image user
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: taskboard-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}   # unprivileged nginx listens on 8080
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}   # nginx pid + temp files
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: taskboard
  labels: {app: frontend, app.kubernetes.io/part-of: taskboard}
spec:
  selector: {app: frontend}
  ports:
    - {name: http, port: 80, targetPort: http}
