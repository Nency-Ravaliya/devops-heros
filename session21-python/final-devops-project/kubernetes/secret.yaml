# Demo credentials only. In a real environment create this Secret out-of-band
# (Sealed Secrets / External Secrets / SOPS) and never commit real passwords.
apiVersion: v1
kind: Secret
metadata:
  name: taskboard-db
  namespace: taskboard
  labels:
    app.kubernetes.io/part-of: taskboard
type: Opaque
stringData:
  DB_USER: taskboard
  DB_PASSWORD: taskboard-dev-password
