# Shared objects for every scenario. Scenarios run in their OWN namespace (tb-debug) because
# namespace taskboard is owned by Argo CD (selfHeal would "fix" our breakage before we can debug it).
# They reuse the Argo-managed Postgres in namespace taskboard over cluster DNS.
apiVersion: v1
kind: Namespace
metadata:
  name: tb-debug
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: tb-debug
data:
  DB_HOST: taskboard-postgres.taskboard.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: taskboard
---
apiVersion: v1
kind: Secret
metadata:
  name: api-db
  namespace: tb-debug
type: Opaque
stringData:
  DB_USER: taskboard
  DB_PASSWORD: taskboard-dev-password
---
# toolbox pod used as an in-cluster client (wget/nslookup) during investigations
apiVersion: v1
kind: Pod
metadata:
  name: toolbox
  namespace: tb-debug
spec:
  containers:
    - name: toolbox
      image: busybox:1.36
      command: ["sh", "-c", "sleep 86400"]
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {cpu: 50m, memory: 16Mi}
