apiVersion: apps/v1
kind: Deployment
metadata:
  name: studytrack-backend
  namespace: {{ .Values.namespace }}
  labels: {{- include "studytrack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: studytrack-backend
  template:
    metadata:
      labels:
        app: studytrack-backend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: backend
          image: {{ include "studytrack.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: studytrack-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: studytrack-db-secret
                  key: DATABASE_URL
          # startup: give alembic + uvicorn up to 60s before liveness kicks in
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: studytrack-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "studytrack.labels" . | nindent 4 }}
    app: studytrack-backend
spec:
  type: ClusterIP
  selector:
    app: studytrack-backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
