apiVersion: apps/v1
kind: Deployment
metadata:
  name: studytrack-frontend
  namespace: {{ .Values.namespace }}
  labels: {{- include "studytrack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: studytrack-frontend
  template:
    metadata:
      labels:
        app: studytrack-frontend
    spec:
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: frontend
          image: {{ include "studytrack.frontendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: studytrack-config
                  key: BACKEND_URL
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: studytrack-frontend
  namespace: {{ .Values.namespace }}
  labels: {{- include "studytrack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: studytrack-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
