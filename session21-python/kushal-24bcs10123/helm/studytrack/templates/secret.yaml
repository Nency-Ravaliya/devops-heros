apiVersion: v1
kind: Secret
metadata:
  name: studytrack-db-secret
  namespace: {{ .Values.namespace }}
  labels: {{- include "studytrack.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  DATABASE_URL: {{ include "studytrack.databaseUrl" . | quote }}
