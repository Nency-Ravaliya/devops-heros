apiVersion: v1
kind: ConfigMap
metadata:
  name: session21-taskboard-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  session21-taskboard.json: |
    {
      "uid": "session21-taskboard",
      "title": "Session 21 - Chhavi TaskBoard",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Total API requests",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum(http_requests_total{namespace=\"taskboard\"})",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Requests per second",
          "type": "timeseries",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"taskboard\"}[2m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "API scrape targets UP",
          "type": "stat",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum(up{namespace=\"taskboard\"})",
              "refId": "A"
            }
          ]
        }
      ]
    }
