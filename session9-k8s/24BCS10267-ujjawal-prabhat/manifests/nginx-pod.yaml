apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  namespace: s09
  labels:
    app: nginx
    owner: 24bcs10267
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 64Mi
