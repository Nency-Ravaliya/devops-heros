apiVersion: v1
kind: Pod
metadata:
  name: campus-portal
  labels:
    app: campus-portal
    tier: frontend
spec:
  containers:
    - name: portal
      image: nginx:1.25-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
