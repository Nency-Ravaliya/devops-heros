{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "stable"
  },
  "spec": {
    "replicas": 9,
    "selector": {
      "matchLabels": {
        "app": "canary-web",
        "version": "stable"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "canary-web",
          "version": "stable"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "web",
            "image": "nginx:stable-alpine",
            "ports": [
              {
                "containerPort": 80
              }
            ],
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "32Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "128Mi"
              }
            },
            "command": [
              "sh",
              "-c",
              "echo '<h1>stable</h1>' > /usr/share/nginx/html/index.html; exec nginx -g 'daemon off;' "
            ]
          }
        ]
      }
    }
  }
}
