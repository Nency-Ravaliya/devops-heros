{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "load-generator"
  },
  "spec": {
    "restartPolicy": "Never",
    "containers": [
      {
        "name": "load",
        "image": "busybox:1.36",
        "command": [
          "sh",
          "-c",
          "while true; do wget -q -O /dev/null http://storage-web; done"
        ],
        "resources": {
          "limits": {
            "cpu": "500m",
            "memory": "64Mi"
          }
        }
      }
    ]
  }
}
