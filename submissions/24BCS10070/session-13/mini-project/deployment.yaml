{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "storage-web"
  },
  "spec": {
    "replicas": 2,
    "selector": {
      "matchLabels": {
        "app": "storage-web"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "storage-web"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "web",
            "image": "nginx:stable-alpine",
            "ports": [
              {
                "containerPort": 80
              }
            ],
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "32Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "128Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/data"
              }
            ],
            "startupProbe": {
              "httpGet": {
                "path": "/",
                "port": 80
              },
              "periodSeconds": 5,
              "failureThreshold": 30
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/",
                "port": 80
              },
              "periodSeconds": 5,
              "failureThreshold": 3
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/",
                "port": 80
              },
              "periodSeconds": 5,
              "failureThreshold": 3
            }
          }
        ],
        "volumes": [
          {
            "name": "data",
            "persistentVolumeClaim": {
              "claimName": "web-data"
            }
          }
        ]
      }
    }
  }
}
