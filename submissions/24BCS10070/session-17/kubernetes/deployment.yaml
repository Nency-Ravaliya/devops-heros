{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "pipeline17"
  },
  "spec": {
    "replicas": 2,
    "selector": {
      "matchLabels": {
        "app": "pipeline17"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "pipeline17"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "app",
            "image": "ghcr.io/chinna-328/devops-heros-session17:replace-with-commit-sha",
            "ports": [
              {
                "containerPort": 8000
              }
            ],
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "32Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "128Mi"
              }
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/health",
                "port": 8000
              }
            }
          }
        ]
      }
    }
  }
}
